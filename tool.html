  "modules/stub.py": "\"\"\"아직 만들지 않은 모듈의 자리표시자.\"\"\"\nimport streamlit as st\n\n\ndef make(name: str):\n    def render():\n        st.info(\n            f\"**{name}**은 아직 비어 있습니다.\\n\\n\"\n            f\"`modules/` 아래에 파일을 만들고 `render()`를 정의한 다음, \"\n            f\"`core/registry.py`에서 이 항목의 `render`를 그 함수로 바꾸고 \"\n            f\"`status`를 `\\\"ready\\\"`로 고치면 됩니다.\"\n        )\n    return render\n",
  "modules/ledger_edit.py": "\"\"\"LG-100 계정별원장 편집 — 계정마다 나뉜 시트를 하나의 통합 원장으로.\"\"\"\nimport io\nfrom datetime import date\n\nimport pandas as pd\nimport streamlit as st\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\nfrom openpyxl.utils import get_column_letter\n\nfrom core import ledger as L\nfrom core.env import in_browser, size_guard\nfrom core.theme import rule\n\nFONT = \"Arial\"\nHDR = PatternFill(\"solid\", fgColor=\"16202E\")\nSUB = PatternFill(\"solid\", fgColor=\"E8E6DF\")\nOK_F = PatternFill(\"solid\", fgColor=\"D1FAE5\")\nNG_F = PatternFill(\"solid\", fgColor=\"FEE2E2\")\n_t = Side(style=\"thin\", color=\"C9C6BA\")\n_m = Side(style=\"medium\", color=\"16202E\")\nBOX = Border(left=_t, right=_t, top=_t, bottom=_t)\n\n# 편집본 서식 — 계정과목이 맨 앞, 차-대 열 포함\nOUT_COLS = [\"계정과목\", \"날짜\", \"적요\", \"거래처코드\", \"거래처명\", \"사업자등록번호\",\n            \"차변금액\", \"대변금액\", \"차-대\", \"잔액\", \"계정코드\", \"계정명\"]\n\n\ndef render():\n    up = st.file_uploader(\"계정별원장 — 계정마다 시트가 나뉜 파일 (.xls / .xlsx)\",\n                          type=[\"xls\", \"xlsx\"])\n    if up is None:\n        st.info(\"회계프로그램에서 뽑은 계정별원장을 그대로 올리시면 됩니다.\\n\\n\"\n                \"계정과목이 시트 이름에만 있어도 열로 만들어 하나의 표로 합칩니다. \"\n                \"[전기이월]·[월계]·[누계] 소계행은 걷어내되, \"\n                \"적요에 쓰인 대괄호([잡코리아]유료서비스 등)는 건드리지 않습니다.\")\n        return\n\n    lvl = size_guard(up)\n    if lvl == \"hard\":\n        st.error(\n            f\"파일이 {up.size/1024/1024:.0f}MB입니다. 브라우저에서 처리하기에는 너무 큽니다.\\n\\n\"\n            \"이 크기는 PC에 설치해서 쓰시는 편이 훨씬 빠릅니다. \"\n            \"홈 화면의 내려받기 안내를 참고해 주세요.\")\n        return\n    if lvl == \"warn\":\n        st.warning(\n            f\"파일이 {up.size/1024/1024:.0f}MB입니다. 브라우저에서는 몇 분 걸릴 수 있고, \"\n            \"처리 중에는 화면이 멈춘 것처럼 보입니다. 탭을 닫지 말고 기다려 주세요.\")\n\n    with st.spinner(\"시트를 읽는 중입니다…\"):\n        try:\n            sheets = L.read_xls_sheets(up)\n        except Exception as e:\n            st.error(f\"파일을 읽지 못했습니다 — {e}\")\n            return\n\n    if not sheets:\n        st.error(\"계정별원장 형태의 시트를 찾지 못했습니다. \"\n                 \"'날짜'와 '차변'이 같은 행에 있는 머리글이 필요합니다.\")\n        return\n\n    st.success(f\"시트 {len(sheets):,}개를 읽었습니다.\")\n    with st.expander(\"시트 인식 결과\", expanded=False):\n        info = pd.DataFrame([{\"원본시트\": s[\"name\"], \"계정코드\": s[\"code\"],\n                              \"계정명\": s[\"account\"], \"행수\": len(s[\"df\"])}\n                             for s in sheets])\n        st.dataframe(info, use_container_width=True, height=280, hide_index=True)\n        miss = info[info[\"계정코드\"] == \"\"]\n        if len(miss):\n            st.warning(f\"계정코드를 못 찾은 시트 {len(miss)}개 — 시트명이 그대로 계정과목이 됩니다.\")\n\n    rule()\n\n    # ── 정리 기준 ────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">정리 기준</div>', unsafe_allow_html=True)\n    c1, c2, c3 = st.columns(3)\n    with c1:\n        drop_sub = st.checkbox(\"소계행 제거\", value=True,\n                               help=\"[전기이월] [월계] [누계] 행을 뺍니다\")\n    with c2:\n        drop_empty = st.checkbox(\"금액 0인 행 제거\", value=True)\n    with c3:\n        sort_by = st.selectbox(\"정렬\", [\"계정코드 → 날짜\", \"날짜 → 계정코드\", \"원본 순서\"])\n\n    with st.spinner(\"시트를 합치는 중입니다…\"):\n        df, summary = L.combine(sheets, drop_subtotal=drop_sub, drop_empty=drop_empty)\n\n    if df.empty:\n        st.error(\"정리 후 남은 데이터가 없습니다.\")\n        return\n\n    if sort_by == \"계정코드 → 날짜\":\n        df = df.sort_values([\"계정코드\", \"날짜\"], kind=\"stable\").reset_index(drop=True)\n    elif sort_by == \"날짜 → 계정코드\":\n        df = df.sort_values([\"날짜\", \"계정코드\"], kind=\"stable\").reset_index(drop=True)\n\n    raw_rows = sum(len(s[\"df\"]) for s in sheets)\n    m1, m2, m3, m4 = st.columns(4)\n    m1.metric(\"원본\", f\"{raw_rows:,}행\")\n    m2.metric(\"통합 후\", f\"{len(df):,}행\", f\"-{raw_rows-len(df):,}\", delta_color=\"off\")\n    m3.metric(\"계정 수\", f\"{df['계정코드'].nunique():,}개\")\n    m4.metric(\"거래처 수\", f\"{df['거래처명'].replace('', pd.NA).nunique():,}개\")\n\n    # ── 산출물 정보 ──────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">산출물 정보</div>', unsafe_allow_html=True)\n    d1, d2, d3, d4 = st.columns(4)\n    with d1:\n        company = st.text_input(\"회사명\", \"마플\")\n    with d2:\n        default_end = date(2025, 12, 31)\n        try:\n            dd = pd.to_datetime(df[\"날짜\"], errors=\"coerce\", format=\"mixed\")\n            if dd.notna().any():\n                default_end = dd.max().date()\n        except Exception:\n            pass\n        period_end = st.date_input(\"결산일\", value=default_end)\n    with d3:\n        version = st.number_input(\"버전\", min_value=1, value=1, step=1)\n    with d4:\n        prepared = st.text_input(\"작성자\", \"\")\n\n    fname = L.suggest_filename(company, pd.Timestamp(period_end), int(version))\n    st.caption(f\"파일명 → **{fname}**\")\n\n    rule()\n\n    # ── 검증 ────────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">검증</div>', unsafe_allow_html=True)\n    res = L.verify(df, summary, pd.Timestamp(period_end))\n\n    v1, v2, v3 = st.columns(3)\n    v1.metric(\"차변 합계\", f\"{res['dr']:,.0f}\")\n    v2.metric(\"대변 합계\", f\"{res['cr']:,.0f}\")\n    v3.metric(\"차이\", f\"{res['diff']:,.0f}\")\n\n    if abs(res[\"diff\"]) < 1:\n        st.success(\"차변과 대변이 일치합니다.\")\n    else:\n        st.error(f\"차변과 대변이 {res['diff']:,.0f}원 일치하지 않습니다. \"\n                 f\"원장에서 빠진 계정이 있는지 확인해 주세요.\")\n\n    st.dataframe(res[\"checks\"], use_container_width=True, hide_index=True)\n\n    st.caption(\"원장 [누계]와 대조 — 원장에 찍힌 누계 금액과 편집 결과가 맞는지 계정별로 \"\n               \"대조합니다. 소계행을 제대로 걷어냈는지 확인하는 가장 확실한 방법입니다.\")\n\n    detail = {\n        \"[누계] 불일치 계정\": res[\"bad_tie\"],\n        \"차·대 동시 기재\": res[\"both\"],\n        \"음수 금액\": res[\"neg\"],\n        \"날짜 인식 실패\": res[\"bad_date\"],\n        \"회계기간 범위 밖\": res[\"out_range\"],\n    }\n    shown = {k: v for k, v in detail.items() if len(v)}\n    if shown:\n        st.markdown('<div class=\"section-label\">확인 대상</div>', unsafe_allow_html=True)\n        for name, t in shown.items():\n            with st.expander(f\"{name} — {len(t):,}건\"):\n                st.dataframe(t.head(500), use_container_width=True,\n                             height=min(300, 40 + 35 * len(t)))\n\n    # ── 계정별 요약 ──────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">계정별 집계</div>', unsafe_allow_html=True)\n    sm_view = summary[[\"계정코드\", \"계정명\", \"행수\", \"차변합계\", \"대변합계\"]].copy()\n    sm_view[\"차-대\"] = sm_view[\"차변합계\"] - sm_view[\"대변합계\"]\n    st.dataframe(\n        sm_view.style.format({\"차변합계\": \"{:,.0f}\", \"대변합계\": \"{:,.0f}\", \"차-대\": \"{:,.0f}\"}),\n        use_container_width=True, height=320, hide_index=True)\n\n    # ── 결과 ────────────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">통합 원장</div>', unsafe_allow_html=True)\n    cols = [c for c in OUT_COLS if c in df.columns]\n    st.dataframe(\n        df[cols].head(300).style.format(\n            {\"차변금액\": \"{:,.0f}\", \"대변금액\": \"{:,.0f}\",\n             \"차-대\": \"{:,.0f}\", \"잔액\": \"{:,.0f}\"}),\n        use_container_width=True, height=380)\n    if len(df) > 300:\n        st.caption(f\"화면에는 앞 300행만 표시했습니다. \"\n                   f\"내려받는 파일에는 {len(df):,}행 전부 들어갑니다.\")\n\n    if st.button(\"엑셀 만들기\", type=\"primary\"):\n        with st.spinner(f\"{len(df):,}행을 쓰는 중입니다…\"):\n            xlsx = _export(df[cols], summary, res, {\n                \"company\": company, \"period_end\": pd.Timestamp(period_end),\n                \"version\": int(version), \"prepared\": prepared,\n                \"source\": up.name, \"raw_rows\": raw_rows,\n                \"sheet_count\": len(sheets),\n            })\n        st.download_button(f\"{fname} 내려받기\", xlsx, file_name=fname,\n                           mime=\"application/vnd.openxmlformats-officedocument.\"\n                                \"spreadsheetml.sheet\")\n\n\n# ─────────────────────────────────────────────────────────────\ndef _export(df: pd.DataFrame, summary: pd.DataFrame, res: dict, meta: dict) -> bytes:\n    wb = Workbook()\n\n    # ── 검증 ────────────────────────────────────────────────\n    ws = wb.active\n    ws.title = \"검증\"\n    ws[\"A1\"] = f\"{meta['company']} 계정별원장 통합 검증\"\n    ws[\"A1\"].font = Font(FONT, size=14, bold=True)\n    ws[\"A2\"] = (f\"결산일 {meta['period_end']:%Y-%m-%d} · v{meta['version']} · \"\n                f\"작성 {meta['prepared'] or '―'} {date.today():%Y-%m-%d}\")\n    ws[\"A2\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n    ws[\"A3\"] = (f\"원본 {meta['source']} · 시트 {meta['sheet_count']:,}개 · \"\n                f\"{meta['raw_rows']:,}행 → 통합 {len(df):,}행\")\n    ws[\"A3\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n\n    last = len(df) + 2  # 통합원장 시트의 마지막 데이터 행 (1행 합계, 2행 머리글)\n    r = 5\n    for c, h in enumerate([\"구분\", \"금액\"], 1):\n        cell = ws.cell(r, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n        cell.alignment = Alignment(\"center\", \"center\")\n    for label, f in [(\"차변 합계\", f\"=SUM('통합원장'!G3:G{last})\"),\n                     (\"대변 합계\", f\"=SUM('통합원장'!H3:H{last})\")]:\n        r += 1\n        ws.cell(r, 1, label).font = Font(FONT, size=10)\n        ws.cell(r, 2, f).number_format = \"#,##0;(#,##0);-\"\n        for c in (1, 2):\n            ws.cell(r, c).border = BOX\n    r += 1\n    ws.cell(r, 1, \"차이 (차변 - 대변)\").font = Font(FONT, bold=True)\n    ws.cell(r, 2, f\"=B{r-2}-B{r-1}\").font = Font(FONT, bold=True)\n    ws.cell(r, 2).number_format = \"#,##0;(#,##0);-\"\n    good = abs(res[\"diff\"]) < 1\n    for c in (1, 2):\n        ws.cell(r, c).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n        ws.cell(r, c).fill = OK_F if good else NG_F\n    r += 1\n    ws.cell(r, 1, \"판정\").font = Font(FONT, bold=True)\n    ws.cell(r, 2, f'=IF(ABS(B{r-1})<1,\"일치\",\"불일치\")').font = Font(FONT, bold=True)\n    for c in (1, 2):\n        ws.cell(r, c).border = BOX\n        ws.cell(r, c).fill = OK_F if good else NG_F\n\n    r += 2\n    ws.cell(r, 1, \"검증 항목\").font = Font(FONT, bold=True, size=11)\n    r += 1\n    for c, h in enumerate([\"항목\", \"결과\", \"내용\"], 1):\n        cell = ws.cell(r, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n        cell.alignment = Alignment(\"center\", \"center\")\n    for _, row in res[\"checks\"].iterrows():\n        r += 1\n        g = row[\"결과\"] in (\"일치\", \"없음\", \"정상\", \"참고\")\n        for c, v in enumerate(row.tolist(), 1):\n            cell = ws.cell(r, c, v)\n            cell.font = Font(FONT, size=10)\n            cell.border = BOX\n            if c == 2:\n                cell.fill = OK_F if g else NG_F\n                cell.alignment = Alignment(\"center\", \"center\")\n    for col, w in zip(\"ABC\", [24, 16, 60]):\n        ws.column_dimensions[col].width = w\n\n    # ── 통합원장 — 편집본 서식 (1행 합계, 2행 머리글) ──────────\n    ws2 = wb.create_sheet(\"통합원장\")\n    cols = list(df.columns)\n    i_dr = cols.index(\"차변금액\") + 1\n    i_cr = cols.index(\"대변금액\") + 1\n    Ldr, Lcr = get_column_letter(i_dr), get_column_letter(i_cr)\n\n    # 1행: 전체 범위 합계 (SUBTOTAL 아님 — 필터에 영향받지 않는다)\n    ws2.cell(1, i_dr, f\"=SUM({Ldr}3:{Ldr}{last})\")\n    ws2.cell(1, i_cr, f\"=SUM({Lcr}3:{Lcr}{last})\")\n    for c in (i_dr, i_cr):\n        cell = ws2.cell(1, c)\n        cell.font = Font(FONT, bold=True, size=11)\n        cell.number_format = \"#,##0\"\n        cell.fill = SUB\n        cell.border = Border(top=_m, bottom=_m, left=_t, right=_t)\n\n    for c, h in enumerate(cols, 1):\n        cell = ws2.cell(2, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n        cell.alignment = Alignment(\"center\", \"center\")\n\n    num_idx = {cols.index(c) + 1 for c in (\"차변금액\", \"대변금액\", \"차-대\", \"잔액\")\n               if c in cols}\n    body = Font(FONT, size=10)\n    for i, rec in enumerate(df.itertuples(index=False), 3):\n        for c, v in enumerate(rec, 1):\n            cell = ws2.cell(i, c, v)\n            cell.font = body\n            if c in num_idx:\n                cell.number_format = \"#,##0;(#,##0);-\"\n\n    ws2.freeze_panes = \"A3\"\n    ws2.auto_filter.ref = f\"A2:{get_column_letter(len(cols))}{last}\"\n    widths = {\"계정과목\": 22, \"날짜\": 12, \"적요\": 34, \"거래처코드\": 11, \"거래처명\": 26,\n              \"사업자등록번호\": 15, \"차변금액\": 16, \"대변금액\": 16, \"차-대\": 16,\n              \"잔액\": 18, \"계정코드\": 10, \"계정명\": 18}\n    for c, h in enumerate(cols, 1):\n        ws2.column_dimensions[get_column_letter(c)].width = widths.get(h, 14)\n\n    # ── 계정별 집계 ──────────────────────────────────────────\n    ws3 = wb.create_sheet(\"계정별집계\")\n    sm = summary[[\"계정코드\", \"계정명\", \"행수\", \"차변합계\", \"대변합계\",\n                  \"전기이월_차변\", \"전기이월_대변\", \"원장누계_차변\", \"원장누계_대변\"]].copy()\n    for c, h in enumerate(list(sm.columns) + [\"차-대\", \"누계대조\"], 1):\n        cell = ws3.cell(1, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n        cell.alignment = Alignment(\"center\", \"center\")\n    for i, rec in enumerate(sm.itertuples(index=False), 2):\n        for c, v in enumerate(rec, 1):\n            cell = ws3.cell(i, c, None if pd.isna(v) else v)\n            cell.font = Font(FONT, size=10)\n            cell.border = BOX\n            if c >= 4:\n                cell.number_format = \"#,##0;(#,##0);-\"\n        ws3.cell(i, 10, f\"=D{i}-E{i}\").number_format = \"#,##0;(#,##0);-\"\n        ws3.cell(i, 11, f'=IF(H{i}=\"\",\"―\",IF(ABS(D{i}+F{i}-H{i})<1,\"일치\",\"불일치\"))')\n        for c in (10, 11):\n            ws3.cell(i, c).font = Font(FONT, size=10)\n            ws3.cell(i, c).border = BOX\n\n    t = len(sm) + 2\n    ws3.cell(t, 2, \"합계\").font = Font(FONT, bold=True)\n    for c in (4, 5):\n        Lc = get_column_letter(c)\n        ws3.cell(t, c, f\"=SUM({Lc}2:{Lc}{t-1})\")\n        ws3.cell(t, c).font = Font(FONT, bold=True)\n        ws3.cell(t, c).number_format = \"#,##0\"\n        ws3.cell(t, c).fill = SUB\n        ws3.cell(t, c).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n    ws3.freeze_panes = \"A2\"\n    ws3.auto_filter.ref = f\"A1:K{t-1}\"\n    for c, w in zip(\"ABCDEFGHIJK\", [10, 20, 9, 17, 17, 15, 15, 17, 17, 17, 11]):\n        ws3.column_dimensions[c].width = w\n\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n",
  "modules/journal_edit.py": "\"\"\"JN-100 분개장 편집 — 어떤 서식이든 표준 형태로 펴고 차대 일치를 검증한다.\"\"\"\nimport io\nimport re\nfrom datetime import date\n\nimport pandas as pd\nimport streamlit as st\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\nfrom openpyxl.utils import get_column_letter\n\nfrom core import journal as J\nfrom core.env import in_browser, size_guard\nfrom core.theme import rule\n\nFONT = \"Arial\"\nHDR = PatternFill(\"solid\", fgColor=\"16202E\")\nSUB = PatternFill(\"solid\", fgColor=\"E8E6DF\")\nOK_F = PatternFill(\"solid\", fgColor=\"D1FAE5\")\nNG_F = PatternFill(\"solid\", fgColor=\"FEE2E2\")\n_t = Side(style=\"thin\", color=\"C9C6BA\")\n_m = Side(style=\"medium\", color=\"16202E\")\nBOX = Border(left=_t, right=_t, top=_t, bottom=_t)\n\n\ndef render():\n    up = st.file_uploader(\"분개장 — 어떤 서식이든 가능 (엑셀 · CSV)\",\n                          type=[\"xlsx\", \"xls\", \"xlsm\", \"csv\"])\n    if up is None:\n        st.info(\"회계프로그램에서 뽑은 분개장을 그대로 올리시면 됩니다. \"\n                \"병합셀·소계행·반복 머리글이 있어도 알아서 정리합니다.\\n\\n\"\n                \"samples/ 폴더에 서로 다른 서식의 시험용 파일 두 개가 있습니다.\")\n        return\n\n    lvl = size_guard(up)\n    if lvl == \"hard\":\n        st.error(\n            f\"파일이 {up.size/1024/1024:.0f}MB입니다. 브라우저에서 처리하기에는 너무 큽니다.\\n\\n\"\n            \"이 크기는 PC에 설치해서 쓰시는 편이 훨씬 빠릅니다. \"\n            \"홈 화면의 내려받기 안내를 참고해 주세요.\")\n        return\n    if lvl == \"warn\":\n        st.warning(\n            f\"파일이 {up.size/1024/1024:.0f}MB입니다. 브라우저에서는 몇 분 걸릴 수 있고, \"\n            \"처리 중에는 화면이 멈춘 것처럼 보입니다. 탭을 닫지 말고 기다려 주세요.\")\n\n    # ── 읽기 ────────────────────────────────────────────────\n    is_excel = up.name.lower().endswith((\".xlsx\", \".xls\", \".xlsm\"))\n    try:\n        if is_excel:\n            xl = pd.ExcelFile(up)\n            sheet = xl.sheet_names[0]\n            if len(xl.sheet_names) > 1:\n                sheet = st.selectbox(\"시트 선택\", xl.sheet_names)\n            probe = pd.read_excel(xl, sheet_name=sheet, header=None, nrows=20)\n            guess_row = J.find_header_row(probe)\n        else:\n            probe, guess_row = None, 0\n            for enc in (\"utf-8-sig\", \"cp949\", \"utf-8\"):\n                try:\n                    up.seek(0)\n                    probe = pd.read_csv(up, encoding=enc, header=None, nrows=20)\n                    enc_used = enc\n                    break\n                except UnicodeDecodeError:\n                    continue\n            if probe is None:\n                st.error(\"인코딩을 인식하지 못했습니다. UTF-8 또는 CP949로 저장해 주세요.\")\n                return\n            guess_row = J.find_header_row(probe)\n    except Exception as e:\n        st.error(f\"파일을 읽지 못했습니다 — {e}\")\n        return\n\n    with st.expander(\"원본 미리보기 (위 20행)\", expanded=guess_row not in (0, -1)):\n        st.dataframe(probe, use_container_width=True, height=240)\n\n    c1, c2 = st.columns([1, 2])\n    with c1:\n        hdr_row = st.number_input(\n            \"머리글이 있는 행\", min_value=1, value=(guess_row + 1) if guess_row >= 0 else 1,\n            help=\"회사명·기간이 위에 붙어 있으면 실제 컬럼명이 있는 행 번호를 지정하세요\")\n    with c2:\n        if guess_row >= 0:\n            st.caption(f\"자동으로 {guess_row + 1}행을 머리글로 판단했습니다. 다르면 왼쪽에서 고쳐주세요.\")\n        else:\n            st.caption(\"머리글을 자동으로 찾지 못했습니다. 미리보기를 보고 직접 지정해 주세요.\")\n\n    try:\n        if is_excel:\n            raw = pd.read_excel(up, sheet_name=sheet, header=int(hdr_row) - 1)\n        else:\n            up.seek(0)\n            raw = pd.read_csv(up, encoding=enc_used, header=int(hdr_row) - 1)\n    except Exception as e:\n        st.error(f\"머리글 행이 맞지 않는 것 같습니다 — {e}\")\n        return\n\n    raw = raw.loc[:, ~raw.columns.astype(str).str.startswith(\"Unnamed\")]\n    if raw.empty:\n        st.error(\"데이터가 없습니다. 머리글 행 번호를 확인해 주세요.\")\n        return\n\n    rule()\n\n    # ── 컬럼 연결 ────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">컬럼 연결</div>', unsafe_allow_html=True)\n    auto = J.guess_mapping(raw.columns)\n    st.caption(f\"{len(raw.columns)}개 컬럼 중 {len(auto)}개를 자동으로 연결했습니다. \"\n               \"없는 항목은 '(없음)'으로 두시면 됩니다.\")\n\n    cols = [\"(없음)\"] + [str(c) for c in raw.columns]\n    col_lookup = {str(c): c for c in raw.columns}\n\n    amount_mode = st.radio(\n        \"금액 서식\",\n        [\"차변·대변 두 컬럼\", \"금액 한 컬럼 (차대구분 별도)\", \"금액 한 컬럼 (부호로 구분)\"],\n        index=0 if (\"차변\" in auto and \"대변\" in auto) else (\n            1 if \"차대구분\" in auto else 2),\n        horizontal=True,\n    )\n\n    fields = [\"전표일자\", \"전표번호\", \"계정코드\", \"계정과목\", \"거래처\", \"적요\", \"작성자\"]\n    fields += ([\"차변\", \"대변\"] if amount_mode.startswith(\"차변\")\n               else ([\"금액\", \"차대구분\"] if \"차대구분\" in amount_mode else [\"금액\"]))\n\n    mapping = {}\n    grid = st.columns(4)\n    for i, f in enumerate(fields):\n        with grid[i % 4]:\n            default = str(auto[f]) if f in auto else \"(없음)\"\n            idx = cols.index(default) if default in cols else 0\n            pick = st.selectbox(f, cols, index=idx, key=f\"jn_{f}\")\n            if pick != \"(없음)\":\n                mapping[f] = col_lookup[pick]\n\n    need = [\"계정과목\"] + ([\"차변\", \"대변\"] if amount_mode.startswith(\"차변\") else [\"금액\"])\n    missing = [f for f in need if f not in mapping]\n    if missing:\n        st.error(f\"필수 항목이 연결되지 않았습니다 — {', '.join(missing)}\")\n        return\n\n    fill_down = st.checkbox(\n        \"빈 전표번호·일자를 위 값으로 채우기\", value=True,\n        help=\"병합셀로 출력된 분개장은 두 번째 줄부터 전표번호가 비어 있습니다\")\n\n    rule()\n\n    # ── 정규화 ──────────────────────────────────────────────\n    df = J.normalize(raw, mapping, fill_down=fill_down)\n    if df.empty:\n        st.error(\"정리 후 남은 데이터가 없습니다. 금액 컬럼 연결을 확인해 주세요.\")\n        return\n\n    removed = len(raw) - len(df)\n    m1, m2, m3 = st.columns(3)\n    m1.metric(\"원본\", f\"{len(raw):,}행\")\n    m2.metric(\"정리 후\", f\"{len(df):,}행\", f\"-{removed:,}\", delta_color=\"off\")\n    m3.metric(\"전표 수\", f\"{df['전표번호'].nunique():,}건\")\n    st.caption(\"소계·합계·반복 머리글·빈 금액 행을 제외한 결과입니다.\")\n\n    # ── 표지 정보 ────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">산출물 정보</div>', unsafe_allow_html=True)\n    d1, d2, d3, d4 = st.columns(4)\n    with d1:\n        company = st.text_input(\"회사명\", \"마플\")\n    with d2:\n        default_end = (df[\"전표일자\"].max().date()\n                       if df[\"전표일자\"].notna().any() else date(2025, 12, 31))\n        fy_end = st.date_input(\"결산일\", value=default_end)\n    with d3:\n        version = st.number_input(\"버전\", min_value=1, value=1, step=1)\n    with d4:\n        prepared = st.text_input(\"작성자\", \"\")\n\n    fname = J.suggest_filename(company, pd.Timestamp(fy_end), int(version))\n    st.caption(f\"파일명 → **{fname}**\")\n\n    rule()\n\n    # ── 검증 ────────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">차대 검증</div>', unsafe_allow_html=True)\n    res = J.verify(df, pd.Timestamp(fy_end))\n\n    v1, v2, v3 = st.columns(3)\n    v1.metric(\"차변 합계\", f\"{res['dr']:,.0f}\")\n    v2.metric(\"대변 합계\", f\"{res['cr']:,.0f}\")\n    v3.metric(\"차이\", f\"{res['diff']:,.0f}\")\n\n    if res[\"ok\"]:\n        st.success(\"차변과 대변이 일치하며 검증 항목에 이상이 없습니다.\")\n    elif abs(res[\"diff\"]) < 1:\n        st.warning(\"총계는 일치하지만 확인이 필요한 항목이 있습니다. 아래를 검토해 주세요.\")\n    else:\n        st.error(f\"차변과 대변이 {res['diff']:,.0f}원 일치하지 않습니다.\")\n\n    st.dataframe(res[\"checks\"], use_container_width=True, hide_index=True)\n\n    detail = {\n        \"대차 불일치 전표\": res[\"unbalanced\"],\n        \"차·대 동시 기재\": res[\"both\"],\n        \"음수 금액\": res[\"neg\"],\n        \"전표일자 인식 실패\": res[\"bad_date\"],\n        \"회계기간 범위 밖\": res[\"out_range\"],\n        \"계정과목 누락\": res[\"no_acct\"],\n    }\n    shown = {k: v for k, v in detail.items() if len(v)}\n    if shown:\n        st.markdown('<div class=\"section-label\">확인 대상 상세</div>', unsafe_allow_html=True)\n        for name, t in shown.items():\n            with st.expander(f\"{name} — {len(t):,}건\"):\n                st.dataframe(t, use_container_width=True, height=min(300, 40 + 35 * len(t)))\n\n    # ── 결과 ────────────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">편집 결과</div>', unsafe_allow_html=True)\n    st.dataframe(\n        df.head(300).style.format({\"차변\": \"{:,.0f}\", \"대변\": \"{:,.0f}\",\n                                   \"전표일자\": lambda d: f\"{d:%Y-%m-%d}\" if pd.notna(d) else \"\"}),\n        use_container_width=True, height=380)\n    if len(df) > 300:\n        st.caption(f\"화면에는 앞 300행만 표시했습니다. 내려받는 파일에는 {len(df):,}행 전부 들어갑니다.\")\n\n    xlsx = _export(df, res, {\n        \"company\": company, \"fy_end\": pd.Timestamp(fy_end),\n        \"version\": int(version), \"prepared\": prepared,\n        \"source\": up.name, \"raw_rows\": len(raw), \"removed\": removed,\n    })\n    st.download_button(f\"{fname} 내려받기\", xlsx, file_name=fname,\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n\n\n# ─────────────────────────────────────────────────────────────\ndef _export(df: pd.DataFrame, res: dict, meta: dict) -> bytes:\n    wb = Workbook()\n\n    # ── 검증 시트 ───────────────────────────────────────────\n    ws = wb.active\n    ws.title = \"검증\"\n    ws[\"A1\"] = f\"{meta['company']} 분개장 편집 검증\"\n    ws[\"A1\"].font = Font(FONT, size=14, bold=True)\n    ws[\"A2\"] = (f\"결산일 {meta['fy_end']:%Y-%m-%d} · v{meta['version']} · \"\n                f\"작성 {meta['prepared'] or '―'} {date.today():%Y-%m-%d}\")\n    ws[\"A2\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n    ws[\"A3\"] = (f\"원본 {meta['source']} · {meta['raw_rows']:,}행 → \"\n                f\"편집 후 {len(df):,}행 (소계·머리글 등 {meta['removed']:,}행 제외)\")\n    ws[\"A3\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n\n    # 합계 블록\n    r = 5\n    ws.cell(r, 1, \"구분\").font = Font(FONT, bold=True, color=\"FFFFFF\")\n    ws.cell(r, 2, \"금액\").font = Font(FONT, bold=True, color=\"FFFFFF\")\n    for c in (1, 2):\n        ws.cell(r, c).fill = HDR\n        ws.cell(r, c).border = BOX\n        ws.cell(r, c).alignment = Alignment(\"center\", \"center\")\n\n    last = len(df) + 1  # 편집결과 시트의 마지막 데이터 행\n    for label, formula in [(\"차변 합계\", f\"=SUM('편집결과'!G2:G{last})\"),\n                           (\"대변 합계\", f\"=SUM('편집결과'!H2:H{last})\")]:\n        r += 1\n        ws.cell(r, 1, label).font = Font(FONT, size=10)\n        ws.cell(r, 2, formula).number_format = \"#,##0;(#,##0);-\"\n        for c in (1, 2):\n            ws.cell(r, c).border = BOX\n    r += 1\n    ws.cell(r, 1, \"차이 (차변 - 대변)\").font = Font(FONT, bold=True)\n    ws.cell(r, 2, f\"=B{r-2}-B{r-1}\").font = Font(FONT, bold=True)\n    ws.cell(r, 2).number_format = \"#,##0;(#,##0);-\"\n    for c in (1, 2):\n        ws.cell(r, c).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n        ws.cell(r, c).fill = OK_F if abs(res[\"diff\"]) < 1 else NG_F\n    r += 1\n    ws.cell(r, 1, \"판정\").font = Font(FONT, bold=True)\n    ws.cell(r, 2, f'=IF(ABS(B{r-1})<1,\"일치\",\"불일치\")').font = Font(FONT, bold=True)\n    for c in (1, 2):\n        ws.cell(r, c).border = BOX\n        ws.cell(r, c).fill = OK_F if abs(res[\"diff\"]) < 1 else NG_F\n\n    # 검증 항목표\n    r += 2\n    ws.cell(r, 1, \"검증 항목\").font = Font(FONT, bold=True, size=11)\n    r += 1\n    for c, h in enumerate([\"항목\", \"결과\", \"내용\"], 1):\n        cell = ws.cell(r, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n        cell.alignment = Alignment(\"center\", \"center\")\n    for _, row in res[\"checks\"].iterrows():\n        r += 1\n        good = row[\"결과\"] in (\"일치\", \"없음\", \"정상\")\n        for c, v in enumerate(row.tolist(), 1):\n            cell = ws.cell(r, c, v)\n            cell.font = Font(FONT, size=10)\n            cell.border = BOX\n            if c == 2:\n                cell.fill = OK_F if good else NG_F\n                cell.alignment = Alignment(\"center\", \"center\")\n\n    for col, w in zip(\"ABC\", [24, 16, 56]):\n        ws.column_dimensions[col].width = w\n\n    # ── 편집결과 시트 ───────────────────────────────────────\n    ws2 = wb.create_sheet(\"편집결과\")\n    out = df.copy()\n    out[\"전표일자\"] = out[\"전표일자\"].dt.strftime(\"%Y-%m-%d\").fillna(\"\")\n\n    for c, h in enumerate(J.STD, 1):\n        cell = ws2.cell(1, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n        cell.alignment = Alignment(\"center\", \"center\")\n\n    for i, (_, row) in enumerate(out.iterrows(), 2):\n        for c, v in enumerate(row.tolist(), 1):\n            val = float(v) if c in (7, 8) else (\"\" if pd.isna(v) else str(v))\n            cell = ws2.cell(i, c, val)\n            cell.font = Font(FONT, size=10)\n            cell.border = BOX\n            if c in (7, 8):\n                cell.number_format = \"#,##0;(#,##0);-\"\n\n    tot = len(out) + 2\n    ws2.cell(tot, 6, \"합계\").font = Font(FONT, bold=True)\n    for c in (7, 8):\n        L = get_column_letter(c)\n        ws2.cell(tot, c, f\"=SUM({L}2:{L}{tot-1})\")\n        ws2.cell(tot, c).font = Font(FONT, bold=True)\n        ws2.cell(tot, c).number_format = \"#,##0\"\n        ws2.cell(tot, c).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n        ws2.cell(tot, c).fill = SUB\n    ws2.cell(tot, 6).fill = SUB\n    ws2.cell(tot, 6).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n\n    ws2.freeze_panes = \"A2\"\n    ws2.auto_filter.ref = f\"A1:{get_column_letter(len(J.STD))}{len(out)+1}\"\n    for c, w in zip(\"ABCDEFGHI\", [12, 14, 11, 20, 18, 30, 16, 16, 10]):\n        ws2.column_dimensions[c].width = w\n\n    # ── 확인대상 시트 ───────────────────────────────────────\n    flagged = {\n        \"대차 불일치 전표\": res[\"unbalanced\"], \"차대 동시 기재\": res[\"both\"],\n        \"음수 금액\": res[\"neg\"], \"일자 인식 실패\": res[\"bad_date\"],\n        \"기간 범위 밖\": res[\"out_range\"], \"계정과목 누락\": res[\"no_acct\"],\n    }\n    flagged = {k: v for k, v in flagged.items() if len(v)}\n    if flagged:\n        ws3 = wb.create_sheet(\"확인대상\")\n        r = 1\n        for name, t in flagged.items():\n            ws3.cell(r, 1, f\"{name} — {len(t):,}건\").font = Font(FONT, bold=True, size=11)\n            r += 1\n            tt = t.copy()\n            for c in tt.columns:\n                if pd.api.types.is_datetime64_any_dtype(tt[c]):\n                    tt[c] = tt[c].dt.strftime(\"%Y-%m-%d\").fillna(\"\")\n            for c, h in enumerate(tt.columns, 1):\n                cell = ws3.cell(r, c, str(h))\n                cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n                cell.fill = HDR\n                cell.border = BOX\n            for _, row in tt.head(500).iterrows():\n                r += 1\n                for c, v in enumerate(row.tolist(), 1):\n                    num = isinstance(v, (int, float)) and not isinstance(v, bool)\n                    cell = ws3.cell(r, c, float(v) if num and pd.notna(v)\n                                    else (\"\" if pd.isna(v) else str(v)))\n                    cell.font = Font(FONT, size=10)\n                    cell.border = BOX\n                    if num:\n                        cell.number_format = \"#,##0;(#,##0);-\"\n            r += 3\n        for c, w in zip(\"ABCDEFGHI\", [14, 14, 12, 20, 18, 28, 16, 16, 10]):\n            ws3.column_dimensions[c].width = w\n\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n",
  "modules/lead.py": "\"\"\"WP-300 조서 작성 — 시산표에서 표지·리드시트·상세조서를 한 번에 만든다.\"\"\"\nimport io\nfrom datetime import date\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\nfrom openpyxl.utils import get_column_letter\n\nfrom core import accounts, loader\nfrom core.theme import rule\n\nFIELDS = [\"계정과목\", \"당기금액\", \"전기금액\"]\nFONT = \"Arial\"\nHDR = PatternFill(\"solid\", fgColor=\"16202E\")\nSUB = PatternFill(\"solid\", fgColor=\"E8E6DF\")\n_t = Side(style=\"thin\", color=\"C9C6BA\")\n_m = Side(style=\"medium\", color=\"16202E\")\nBOX = Border(left=_t, right=_t, top=_t, bottom=_t)\n\n# 리드시트 참조번호 체계 — 감사조서 관행\nREF = {\n    \"유동자산\": \"A\", \"비유동자산\": \"B\", \"유동부채\": \"C\", \"비유동부채\": \"D\", \"자본\": \"E\",\n    \"매출\": \"F\", \"매출원가\": \"G\", \"판매비와관리비\": \"H\",\n    \"영업외수익\": \"I\", \"영업외비용\": \"J\", \"법인세\": \"K\", \"미분류\": \"Z\",\n}\n\n\ndef render():\n    up = st.file_uploader(\"시산표 — 계정과목 / 당기금액 / 전기금액\",\n                          type=[\"csv\", \"xlsx\", \"xls\", \"xlsm\"])\n    if up is None:\n        st.info(\"시산표를 올리면 계정그룹별 리드시트가 만들어집니다. \"\n                \"samples/trial_balance.csv로 시험해 보셔도 됩니다.\")\n        return\n\n    try:\n        raw = loader.read_any(up)\n    except Exception as e:\n        st.error(f\"파일을 읽지 못했습니다 — {e}\")\n        return\n\n    mapping = loader.map_columns(raw, FIELDS)\n    if mapping is None:\n        return\n\n    df = loader.standardize_numeric(loader.rename(raw, mapping), [\"당기금액\", \"전기금액\"])\n    df = df.dropna(subset=[\"계정과목\"]).fillna({\"당기금액\": 0, \"전기금액\": 0})\n    df = accounts.classify(df)\n    df[\"증감액\"] = df[\"당기금액\"] - df[\"전기금액\"]\n    df[\"증감률\"] = np.where(df[\"전기금액\"] != 0, df[\"증감액\"] / df[\"전기금액\"].abs(), np.nan)\n\n    rule()\n\n    # ── 표지 정보 ────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">표지 정보</div>', unsafe_allow_html=True)\n    c1, c2, c3 = st.columns(3)\n    with c1:\n        company = st.text_input(\"회사명\", \"주식회사 ○○\")\n        prepared = st.text_input(\"작성자\", \"\")\n    with c2:\n        period = st.text_input(\"대상기간\", f\"{date.today().year - 1}.01.01 ~ {date.today().year - 1}.12.31\")\n        reviewed = st.text_input(\"검토자\", \"\")\n    with c3:\n        engagement = st.selectbox(\"업무 구분\", [\"외부감사\", \"검토\", \"합의된절차\", \"기타\"])\n        wp_date = st.date_input(\"작성일\", value=date.today())\n\n    st.markdown('<div class=\"section-label\">구성</div>', unsafe_allow_html=True)\n    c4, c5, c6 = st.columns(3)\n    with c4:\n        tick = st.checkbox(\"검토표시(tick mark) 열 넣기\", value=True)\n    with c5:\n        include_pl = st.checkbox(\"손익 리드시트 포함\", value=True)\n    with c6:\n        mat = st.number_input(\"수행중요성 (원)\", value=100_000_000, step=10_000_000, format=\"%d\",\n                              help=\"이 금액 이상인 계정에 검토대상 표시를 넣습니다\")\n\n    groups = [g for g in accounts.ORDER if g in set(df[\"세부구분\"].astype(str))]\n    if not include_pl:\n        groups = [g for g in groups if g in (\"유동자산\", \"비유동자산\", \"유동부채\", \"비유동부채\", \"자본\")]\n    picked = st.multiselect(\"만들 리드시트\", groups, default=groups)\n    if not picked:\n        st.warning(\"리드시트를 하나 이상 선택해 주세요.\")\n        return\n\n    rule()\n\n    # ── 미리보기 ────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">미리보기</div>', unsafe_allow_html=True)\n    idx = st.selectbox(\"리드시트 선택\", picked)\n    sub = df[df[\"세부구분\"].astype(str) == idx].sort_values(\"당기금액\", key=abs, ascending=False)\n    view = sub[[\"계정과목\", \"전기금액\", \"당기금액\", \"증감액\", \"증감률\"]].copy()\n    view.insert(0, \"조서참조\", [f\"{REF.get(idx,'Z')}-{i:02d}\" for i in range(1, len(view) + 1)])\n    view[\"검토대상\"] = np.where(sub[\"당기금액\"].abs() >= mat, \"○\", \"\")\n    st.dataframe(\n        view.style.format({\"전기금액\": \"{:,.0f}\", \"당기금액\": \"{:,.0f}\",\n                           \"증감액\": \"{:,.0f}\", \"증감률\": \"{:+.1%}\"}),\n        use_container_width=True, hide_index=True)\n\n    n_target = int((df[df[\"세부구분\"].astype(str).isin(picked)][\"당기금액\"].abs() >= mat).sum())\n    st.caption(f\"리드시트 {len(picked)}개 · 계정 {len(df[df['세부구분'].astype(str).isin(picked)])}개 · \"\n               f\"수행중요성 초과 {n_target}개\")\n\n    # ── 내려받기 ────────────────────────────────────────────\n    rule()\n    meta = dict(company=company, period=period, engagement=engagement,\n                prepared=prepared, reviewed=reviewed, wp_date=wp_date, mat=mat)\n    xlsx = _export(df, picked, meta, tick)\n    st.download_button(\"조서 내려받기 (xlsx)\", xlsx,\n                       file_name=f\"조서_{company}_{date.today():%y%m%d}.xlsx\",\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n\n\n# ─────────────────────────────────────────────────────────────\ndef _export(df, groups, meta, tick):\n    wb = Workbook()\n\n    # ── 표지 ────────────────────────────────────────────────\n    ws = wb.active\n    ws.title = \"표지\"\n    ws[\"B2\"] = meta[\"company\"]\n    ws[\"B2\"].font = Font(FONT, size=20, bold=True)\n    ws[\"B3\"] = f\"{meta['engagement']} 조서\"\n    ws[\"B3\"].font = Font(FONT, size=12, color=\"6B7280\")\n    ws[\"B5\"] = meta[\"period\"]\n    ws[\"B5\"].font = Font(FONT, size=11)\n\n    info = [(\"작성자\", meta[\"prepared\"]), (\"작성일\", f\"{meta['wp_date']:%Y-%m-%d}\"),\n            (\"검토자\", meta[\"reviewed\"]), (\"검토일\", \"\"),\n            (\"수행중요성\", f\"{meta['mat']:,.0f}원\")]\n    r = 8\n    for label, value in info:\n        ws.cell(r, 2, label).font = Font(FONT, size=10, bold=True)\n        ws.cell(r, 3, value).font = Font(FONT, size=10)\n        ws.cell(r, 3).border = Border(bottom=_t)\n        r += 1\n\n    r += 1\n    ws.cell(r, 2, \"조서 목차\").font = Font(FONT, size=11, bold=True)\n    r += 1\n    for c, h in enumerate([\"참조\", \"리드시트\", \"당기금액\"], 2):\n        cell = ws.cell(r, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n    for g in groups:\n        r += 1\n        sub = df[df[\"세부구분\"].astype(str) == g]\n        ws.cell(r, 2, REF.get(g, \"Z\")).font = Font(FONT, size=10)\n        ws.cell(r, 3, g).font = Font(FONT, size=10)\n        ws.cell(r, 4, float(sub[\"당기금액\"].sum())).number_format = \"#,##0\"\n        for c in range(2, 5):\n            ws.cell(r, c).border = BOX\n\n    for col, w in zip(\"ABCD\", [3, 16, 30, 20]):\n        ws.column_dimensions[col].width = w\n\n    # ── 리드시트 ────────────────────────────────────────────\n    for g in groups:\n        _lead_sheet(wb, df, g, meta, tick)\n\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n\n\ndef _lead_sheet(wb, df, group, meta, tick):\n    ref = REF.get(group, \"Z\")\n    ws = wb.create_sheet(f\"{ref} {group}\"[:31])\n    sub = df[df[\"세부구분\"].astype(str) == group].sort_values(\"당기금액\", key=abs, ascending=False)\n\n    ws[\"A1\"] = f\"{meta['company']}   |   {group} 리드시트\"\n    ws[\"A1\"].font = Font(FONT, size=13, bold=True)\n    ws[\"A2\"] = f\"{meta['period']}   ·   참조 {ref}   ·   작성 {meta['prepared'] or '―'} \" \\\n               f\"{meta['wp_date']:%Y-%m-%d}   ·   검토 {meta['reviewed'] or '―'}\"\n    ws[\"A2\"].font = Font(FONT, size=9, color=\"6B7280\")\n\n    cols = [\"조서참조\", \"계정과목\", \"전기금액\", \"당기금액\", \"증감액\", \"증감률\"]\n    if tick:\n        cols += [\"검토표시\", \"비고\"]\n    else:\n        cols += [\"비고\"]\n\n    for c, h in enumerate(cols, 1):\n        cell = ws.cell(4, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.alignment = Alignment(\"center\", \"center\")\n        cell.border = BOX\n\n    r = 5\n    for i, (_, row) in enumerate(sub.iterrows(), 1):\n        ws.cell(r, 1, f\"{ref}-{i:02d}\").font = Font(FONT, size=10)\n        ws.cell(r, 2, str(row[\"계정과목\"])).font = Font(FONT, size=10)\n        ws.cell(r, 3, float(row[\"전기금액\"]))\n        ws.cell(r, 4, float(row[\"당기금액\"]))\n        ws.cell(r, 5, f\"=D{r}-C{r}\")\n        ws.cell(r, 6, f'=IF(C{r}=0,\"\",E{r}/ABS(C{r}))')\n        if abs(row[\"당기금액\"]) >= meta[\"mat\"]:\n            ws.cell(r, 2).font = Font(FONT, size=10, bold=True)\n        for c in range(1, len(cols) + 1):\n            ws.cell(r, c).border = BOX\n        for c in (3, 4, 5):\n            ws.cell(r, c).number_format = \"#,##0;(#,##0);-\"\n            ws.cell(r, c).font = Font(FONT, size=10)\n        ws.cell(r, 6).number_format = \"0.0%;(0.0%);-\"\n        ws.cell(r, 6).font = Font(FONT, size=10)\n        r += 1\n\n    ws.cell(r, 2, \"합계\").font = Font(FONT, bold=True)\n    for c in (3, 4, 5):\n        L = get_column_letter(c)\n        ws.cell(r, c, f\"=SUM({L}5:{L}{r-1})\")\n        ws.cell(r, c).font = Font(FONT, bold=True)\n        ws.cell(r, c).number_format = \"#,##0;(#,##0);-\"\n        ws.cell(r, c).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n    ws.cell(r, 1).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n    for c in range(6, len(cols) + 1):\n        ws.cell(r, c).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n    ws.cell(r, 2).border = Border(top=_m, bottom=_m, left=_t, right=_t)\n\n    r += 2\n    ws.cell(r, 1, \"검토표시 범례\").font = Font(FONT, size=9, bold=True)\n    for legend in [\"✓  총계정원장과 대조 완료\",\n                   \"①  전기 감사조서와 대조 완료\",\n                   \"②  외부조회서 회신 대조\",\n                   \"③  증빙 표본검사 완료\",\n                   \"**  수행중요성 초과 — 개별 검토 대상 (계정과목 굵게 표시)\"]:\n        r += 1\n        ws.cell(r, 1, legend).font = Font(FONT, size=9, color=\"6B7280\")\n\n    widths = [12, 26, 18, 18, 18, 11] + ([10, 30] if tick else [30])\n    for c, w in enumerate(widths, 1):\n        ws.column_dimensions[get_column_letter(c)].width = w\n    ws.freeze_panes = \"A5\"\n",
  "modules/fs.py": "\"\"\"FS-200 재무제표 분석 — 증감분석 · 비율분석 · 코멘트 초안.\"\"\"\nimport io\n\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\nfrom openpyxl.utils import get_column_letter\n\nfrom core import accounts, loader\nfrom core.theme import rule\n\nFIELDS = [\"계정과목\", \"당기금액\", \"전기금액\"]\nFONT = \"Arial\"\nHDR = PatternFill(\"solid\", fgColor=\"16202E\")\nSUB = PatternFill(\"solid\", fgColor=\"E8E6DF\")\nFLAG = PatternFill(\"solid\", fgColor=\"FCE8E6\")\n_t = Side(style=\"thin\", color=\"C9C6BA\")\nBOX = Border(left=_t, right=_t, top=_t, bottom=_t)\n\n\ndef render():\n    up = st.file_uploader(\"시산표 — 계정과목 / 당기금액 / 전기금액\",\n                          type=[\"csv\", \"xlsx\", \"xls\", \"xlsm\"])\n    if up is None:\n        st.info(\"2개년 시산표를 올려주세요. samples/trial_balance.csv로 시험해 보셔도 됩니다.\")\n        return\n\n    try:\n        raw = loader.read_any(up)\n    except Exception as e:\n        st.error(f\"파일을 읽지 못했습니다 — {e}\")\n        return\n\n    st.caption(f\"{len(raw):,}행 × {len(raw.columns)}열\")\n    mapping = loader.map_columns(raw, FIELDS)\n    if mapping is None:\n        return\n\n    df = loader.standardize_numeric(loader.rename(raw, mapping), [\"당기금액\", \"전기금액\"])\n    df = df.dropna(subset=[\"계정과목\"]).fillna({\"당기금액\": 0, \"전기금액\": 0})\n    df = accounts.classify(df)\n\n    # ── 분류 확인 ────────────────────────────────────────────\n    unknown = df[df[\"세부구분\"] == \"미분류\"]\n    with st.expander(f\"계정 분류 확인 — 자동 분류 {len(df)-len(unknown)}건 / 미분류 {len(unknown)}건\",\n                     expanded=len(unknown) > 0):\n        st.caption(\"계정명으로 추정한 결과입니다. 틀린 항목은 세부구분을 직접 고쳐주세요.\")\n        edited = st.data_editor(\n            df[[\"계정과목\", \"세부구분\", \"당기금액\", \"전기금액\"]],\n            column_config={\"세부구분\": st.column_config.SelectboxColumn(options=accounts.ORDER)},\n            use_container_width=True, hide_index=True, height=320, key=\"cls\",\n        )\n        df[\"세부구분\"] = edited[\"세부구분\"].values\n        df[\"구분\"] = np.where(df[\"세부구분\"].isin([\"유동자산\", \"비유동자산\"]), \"자산\",\n                    np.where(df[\"세부구분\"].isin([\"유동부채\", \"비유동부채\"]), \"부채\",\n                    np.where(df[\"세부구분\"] == \"자본\", \"자본\",\n                    np.where(df[\"세부구분\"] == \"미분류\", \"미분류\", \"손익\"))))\n\n    rule()\n\n    # ── 임계치 ──────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">유의성 기준</div>', unsafe_allow_html=True)\n    c1, c2, c3 = st.columns(3)\n    with c1:\n        amt_th = st.number_input(\"금액 임계치 (원)\", value=100_000_000, step=10_000_000, format=\"%d\",\n                                 help=\"이 금액을 넘는 증감만 유의적으로 봅니다\")\n    with c2:\n        pct_th = st.slider(\"증감률 임계치 (%)\", 5, 100, 20)\n    with c3:\n        both = st.radio(\"적용 방식\", [\"금액 AND 증감률\", \"금액 OR 증감률\"], index=0,\n                        help=\"AND는 둘 다 넘을 때만, OR은 하나만 넘어도 적출\")\n\n    df[\"증감액\"] = df[\"당기금액\"] - df[\"전기금액\"]\n    df[\"증감률\"] = np.where(df[\"전기금액\"] != 0, df[\"증감액\"] / df[\"전기금액\"].abs(), np.nan)\n\n    over_a = df[\"증감액\"].abs() >= amt_th\n    over_p = df[\"증감률\"].abs() >= pct_th / 100\n    df[\"유의\"] = (over_a & over_p) if both.endswith(\"증감률\") and \"AND\" in both else (over_a | over_p)\n\n    rule()\n\n    # ── 재무제표 요약 ────────────────────────────────────────\n    cur, pri = \"당기금액\", \"전기금액\"\n    S = lambda s, c: accounts.subtotal(df, s, c)\n    tot_asset_c = S(\"유동자산\", cur) + S(\"비유동자산\", cur)\n    tot_asset_p = S(\"유동자산\", pri) + S(\"비유동자산\", pri)\n    tot_liab_c = S(\"유동부채\", cur) + S(\"비유동부채\", cur)\n    tot_liab_p = S(\"유동부채\", pri) + S(\"비유동부채\", pri)\n    equity_c, equity_p = S(\"자본\", cur), S(\"자본\", pri)\n    rev_c, rev_p = S(\"매출\", cur), S(\"매출\", pri)\n    cogs_c, cogs_p = S(\"매출원가\", cur), S(\"매출원가\", pri)\n    sga_c, sga_p = S(\"판매비와관리비\", cur), S(\"판매비와관리비\", pri)\n    op_c, op_p = rev_c - cogs_c - sga_c, rev_p - cogs_p - sga_p\n\n    for label, a, l, e in [(\"당기\", tot_asset_c, tot_liab_c, equity_c),\n                           (\"전기\", tot_asset_p, tot_liab_p, equity_p)]:\n        gap = a - l - e\n        if abs(gap) > 1:\n            st.warning(f\"{label} 대차 불일치 {gap:,.0f}원 — 자산 {a:,.0f} vs 부채+자본 {l+e:,.0f}. \"\n                       f\"계정 분류나 누락 계정을 먼저 확인해 주세요.\")\n\n    st.markdown('<div class=\"section-label\">요약</div>', unsafe_allow_html=True)\n    m = st.columns(4)\n    for col, (label, c, p) in zip(m, [\n        (\"총자산\", tot_asset_c, tot_asset_p), (\"총부채\", tot_liab_c, tot_liab_p),\n        (\"매출\", rev_c, rev_p), (\"영업이익\", op_c, op_p),\n    ]):\n        with col:\n            d = (c - p) / abs(p) * 100 if p else 0\n            st.metric(label, f\"{c/1e8:,.1f}억\", f\"{d:+.1f}%\")\n\n    # ── 증감분석 ────────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">증감분석</div>', unsafe_allow_html=True)\n    flagged = df[df[\"유의\"]].sort_values(\"증감액\", key=abs, ascending=False)\n    st.caption(f\"유의적 증감 {len(flagged)}개 계정 / 전체 {len(df)}개\")\n\n    show = flagged[[\"세부구분\", \"계정과목\", \"전기금액\", \"당기금액\", \"증감액\", \"증감률\"]].copy()\n    st.dataframe(\n        show.style.format({\"전기금액\": \"{:,.0f}\", \"당기금액\": \"{:,.0f}\",\n                           \"증감액\": \"{:,.0f}\", \"증감률\": \"{:+.1%}\"}),\n        use_container_width=True, height=min(420, 40 + 35 * len(show)))\n\n    # ── 비율분석 ────────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">비율분석</div>', unsafe_allow_html=True)\n    ratios = _ratios(df, S, tot_asset_c, tot_asset_p, tot_liab_c, tot_liab_p,\n                     equity_c, equity_p, rev_c, rev_p, cogs_c, cogs_p, op_c, op_p)\n    st.dataframe(ratios, use_container_width=True, hide_index=True)\n\n    # ── 코멘트 초안 ──────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">코멘트 초안</div>', unsafe_allow_html=True)\n    st.caption(\"규칙 기반 초안입니다. 그대로 쓰지 마시고 근거를 확인한 뒤 다듬어 주세요.\")\n    comments = _comments(df, flagged, rev_c, rev_p, cogs_c, cogs_p, sga_c, sga_p)\n    for c in comments:\n        st.markdown(f\"- {c}\")\n    st.text_area(\"편집\", \"\\n\".join(f\"- {c}\" for c in comments), height=200, key=\"cmt\")\n\n    # ── 내려받기 ────────────────────────────────────────────\n    rule()\n    xlsx = _export(df, flagged, ratios, comments, amt_th, pct_th)\n    st.download_button(\"분석조서 내려받기 (xlsx)\", xlsx, file_name=\"FS_증감분석.xlsx\",\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n\n\n# ─────────────────────────────────────────────────────────────\ndef _pct(n, d):\n    return n / d if d else np.nan\n\n\ndef _ratios(df, S, ta_c, ta_p, tl_c, tl_p, eq_c, eq_p, rev_c, rev_p, cogs_c, cogs_p, op_c, op_p):\n    ca_c, ca_p = S(\"유동자산\", \"당기금액\"), S(\"유동자산\", \"전기금액\")\n    cl_c, cl_p = S(\"유동부채\", \"당기금액\"), S(\"유동부채\", \"전기금액\")\n    inv_c = accounts.find(df, \"재고\", \"당기금액\")\n    inv_p = accounts.find(df, \"재고\", \"전기금액\")\n    ar_c = accounts.find(df, \"매출채권\", \"당기금액\")\n    ar_p = accounts.find(df, \"매출채권\", \"전기금액\")\n    int_c = accounts.find(df, \"이자비용\", \"당기금액\")\n    int_p = accounts.find(df, \"이자비용\", \"전기금액\")\n\n    items = [\n        (\"유동비율\", _pct(ca_c, cl_c), _pct(ca_p, cl_p), \"%\", \"유동자산 ÷ 유동부채\"),\n        (\"당좌비율\", _pct(ca_c - inv_c, cl_c), _pct(ca_p - inv_p, cl_p), \"%\", \"(유동자산-재고) ÷ 유동부채\"),\n        (\"부채비율\", _pct(tl_c, eq_c), _pct(tl_p, eq_p), \"%\", \"총부채 ÷ 자본\"),\n        (\"자기자본비율\", _pct(eq_c, ta_c), _pct(eq_p, ta_p), \"%\", \"자본 ÷ 총자산\"),\n        (\"매출총이익률\", _pct(rev_c - cogs_c, rev_c), _pct(rev_p - cogs_p, rev_p), \"%\", \"매출총이익 ÷ 매출\"),\n        (\"영업이익률\", _pct(op_c, rev_c), _pct(op_p, rev_p), \"%\", \"영업이익 ÷ 매출\"),\n        (\"총자산회전율\", _pct(rev_c, ta_c), _pct(rev_p, ta_p), \"회\", \"매출 ÷ 총자산\"),\n        (\"매출채권회전율\", _pct(rev_c, ar_c), _pct(rev_p, ar_p), \"회\", \"매출 ÷ 매출채권\"),\n        (\"재고자산회전율\", _pct(cogs_c, inv_c), _pct(cogs_p, inv_p), \"회\", \"매출원가 ÷ 재고자산\"),\n        (\"이자보상배율\", _pct(op_c, int_c), _pct(op_p, int_p), \"배\", \"영업이익 ÷ 이자비용\"),\n    ]\n    rows = []\n    for name, c, p, unit, basis in items:\n        fmt = (lambda v: \"—\" if pd.isna(v) else (f\"{v*100:,.1f}%\" if unit == \"%\" else f\"{v:,.2f}{unit}\"))\n        chg = \"—\"\n        if not (pd.isna(c) or pd.isna(p)):\n            d = (c - p) * 100 if unit == \"%\" else c - p\n            chg = f\"{d:+,.1f}%p\" if unit == \"%\" else f\"{d:+,.2f}{unit}\"\n        rows.append({\"지표\": name, \"당기\": fmt(c), \"전기\": fmt(p), \"증감\": chg, \"산식\": basis})\n    return pd.DataFrame(rows)\n\n\ndef _comments(df, flagged, rev_c, rev_p, cogs_c, cogs_p, sga_c, sga_p):\n    out = []\n    g = lambda c, p: (c - p) / abs(p) if p else np.nan\n    F = lambda k, col: accounts.find(df, k, col)\n\n    rev_g, cogs_g = g(rev_c, rev_p), g(cogs_c, cogs_p)\n\n    # 매출채권 대 매출\n    ar_c, ar_p = F(\"매출채권\", \"당기금액\"), F(\"매출채권\", \"전기금액\")\n    if ar_p and not pd.isna(rev_g):\n        ar_g = g(ar_c, ar_p)\n        if ar_g - rev_g > 0.10:\n            out.append(\n                f\"**매출채권**이 전기 대비 {ar_g:+.1%}({ar_c-ar_p:,.0f}원) 변동하여 \"\n                f\"매출 증가율 {rev_g:+.1%}를 {(ar_g-rev_g)*100:.0f}%p 상회함. \"\n                f\"회수기간 장기화 또는 기말 매출인식 시점 검토가 필요함.\")\n        # 대손충당금 설정률\n        al_c, al_p = abs(F(\"대손충당\", \"당기금액\")), abs(F(\"대손충당\", \"전기금액\"))\n        if ar_c and al_c:\n            r_c, r_p = al_c / ar_c, (al_p / ar_p if ar_p else np.nan)\n            if not pd.isna(r_p) and r_p - r_c > 0.003:\n                out.append(\n                    f\"**대손충당금 설정률**이 전기 {r_p:.2%}에서 당기 {r_c:.2%}로 하락함. \"\n                    f\"채권 연령분석표를 입수하여 설정률 산정근거의 타당성을 확인할 것.\")\n\n    # 재고자산 대 매출원가\n    inv_c, inv_p = F(\"재고\", \"당기금액\"), F(\"재고\", \"전기금액\")\n    if inv_p and not pd.isna(cogs_g):\n        inv_g = g(inv_c, inv_p)\n        if inv_g - cogs_g > 0.10:\n            out.append(\n                f\"**재고자산**이 {inv_g:+.1%} 변동하여 매출원가 증가율 {cogs_g:+.1%}를 상회함. \"\n                f\"장기체화·진부화 재고 여부와 순실현가능가치 평가를 확인할 것.\")\n\n    # 매출총이익률\n    if rev_c and rev_p:\n        gp_c, gp_p = (rev_c - cogs_c) / rev_c, (rev_p - cogs_p) / rev_p\n        if abs(gp_c - gp_p) >= 0.01:\n            out.append(\n                f\"**매출총이익률**이 전기 {gp_p:.1%}에서 당기 {gp_c:.1%}로 \"\n                f\"{(gp_c-gp_p)*100:+.1f}%p 변동함. 제품별·거래처별 원가율 분해가 필요함.\")\n\n    # 판관비 대 매출\n    if sga_p and not pd.isna(rev_g):\n        sga_g = g(sga_c, sga_p)\n        if sga_g - rev_g > 0.05:\n            out.append(\n                f\"**판매비와관리비**가 {sga_g:+.1%} 증가하여 매출 증가율을 상회함. \"\n                f\"증가 기여 계정을 특정하고 일회성 여부를 확인할 것.\")\n\n    # 차입금·이자비용 정합성\n    dbt_c = F(\"차입금\", \"당기금액\") + F(\"사채\", \"당기금액\")\n    dbt_p = F(\"차입금\", \"전기금액\") + F(\"사채\", \"전기금액\")\n    int_c, int_p = F(\"이자비용\", \"당기금액\"), F(\"이자비용\", \"전기금액\")\n    if dbt_p and int_p:\n        r_c, r_p = int_c / dbt_c if dbt_c else np.nan, int_p / dbt_p\n        if not pd.isna(r_c) and abs(r_c - r_p) > 0.005:\n            out.append(\n                f\"**차입금 평균이자율**이 전기 {r_p:.2%}에서 당기 {r_c:.2%}로 변동함. \"\n                f\"차입약정서와 대조하여 이자비용의 완전성을 확인할 것.\")\n\n    # 나머지 유의계정\n    named = \"매출채권|대손충당|재고|매출원가|차입금|사채|이자비용\"\n    rest = flagged[~flagged[\"계정과목\"].astype(str).str.contains(named, na=False)\n                   & ~flagged[\"세부구분\"].isin([\"매출\", \"매출원가\"])]\n    for _, r in rest.head(4).iterrows():\n        pct = \"—\" if pd.isna(r[\"증감률\"]) else f\"{r['증감률']:+.1%}\"\n        name = r[\"계정과목\"]\n        out.append(\n            f\"**{name}**{accounts.josa(name)} {r['증감액']:,.0f}원({pct}) 변동함. \"\n            f\"증감 사유에 대한 경영진 문의 및 증빙 대사가 필요함.\")\n\n    return out or [\"설정하신 임계치를 넘는 유의적 증감이 없습니다. 임계치를 낮춰 다시 확인해 보세요.\"]\n\n\ndef _export(df, flagged, ratios, comments, amt_th, pct_th):\n    wb = Workbook()\n    ws = wb.active\n    ws.title = \"증감분석\"\n    ws[\"A1\"] = \"재무제표 증감분석\"\n    ws[\"A1\"].font = Font(FONT, size=14, bold=True)\n    ws[\"A2\"] = f\"유의성 기준: 금액 {amt_th:,.0f}원 · 증감률 {pct_th}%\"\n    ws[\"A2\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n\n    cols = [\"세부구분\", \"계정과목\", \"전기금액\", \"당기금액\", \"증감액\", \"증감률\"]\n    for c, h in enumerate(cols, 1):\n        cell = ws.cell(4, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.alignment = Alignment(\"center\", \"center\")\n        cell.border = BOX\n\n    d = df.sort_values([\"세부구분\", \"계정과목\"])\n    r = 5\n    for _, row in d.iterrows():\n        ws.cell(r, 1, str(row[\"세부구분\"]))\n        ws.cell(r, 2, str(row[\"계정과목\"]))\n        ws.cell(r, 3, float(row[\"전기금액\"]))\n        ws.cell(r, 4, float(row[\"당기금액\"]))\n        ws.cell(r, 5, f\"=D{r}-C{r}\")\n        ws.cell(r, 6, f'=IF(C{r}=0,\"\",E{r}/ABS(C{r}))')\n        for c in range(1, 7):\n            ws.cell(r, c).border = BOX\n            if row[\"유의\"]:\n                ws.cell(r, c).fill = FLAG\n        for c in (3, 4, 5):\n            ws.cell(r, c).number_format = \"#,##0;(#,##0);-\"\n        ws.cell(r, 6).number_format = \"0.0%;(0.0%);-\"\n        r += 1\n\n    ws.cell(r, 2, \"합계\").font = Font(FONT, bold=True)\n    for c in (3, 4):\n        ws.cell(r, c, f\"=SUM({get_column_letter(c)}5:{get_column_letter(c)}{r-1})\")\n        ws.cell(r, c).font = Font(FONT, bold=True)\n        ws.cell(r, c).number_format = \"#,##0\"\n    for c in range(1, 7):\n        ws.cell(r, c).fill = SUB\n        ws.cell(r, c).border = BOX\n\n    ws.cell(r + 2, 1, \"음영 표시 = 유의성 기준 초과 계정\").font = Font(FONT, size=9, color=\"6B7280\")\n    for col, w in zip(\"ABCDEF\", [16, 24, 18, 18, 18, 12]):\n        ws.column_dimensions[col].width = w\n    ws.freeze_panes = \"A5\"\n\n    ws2 = wb.create_sheet(\"비율분석\")\n    for c, h in enumerate(ratios.columns, 1):\n        cell = ws2.cell(1, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.border = BOX\n    for i, (_, row) in enumerate(ratios.iterrows(), 2):\n        for c, v in enumerate(row, 1):\n            cell = ws2.cell(i, c, v)\n            cell.font = Font(FONT, size=10)\n            cell.border = BOX\n    for col, w in zip(\"ABCDE\", [18, 14, 14, 14, 30]):\n        ws2.column_dimensions[col].width = w\n\n    ws3 = wb.create_sheet(\"코멘트\")\n    ws3[\"A1\"] = \"분석 코멘트 초안\"\n    ws3[\"A1\"].font = Font(FONT, size=12, bold=True)\n    ws3[\"A2\"] = \"규칙 기반 자동 생성. 근거 확인 후 수정하여 사용할 것.\"\n    ws3[\"A2\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n    for i, c in enumerate(comments, 4):\n        cell = ws3.cell(i, 1, \"· \" + c.replace(\"**\", \"\"))\n        cell.font = Font(FONT, size=10)\n        cell.alignment = Alignment(wrap_text=True, vertical=\"top\")\n        ws3.row_dimensions[i].height = 32\n    ws3.column_dimensions[\"A\"].width = 110\n\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n",
  "modules/jet.py": "\"\"\"JE-100 전표 이상징후 분석.\"\"\"\nimport numpy as np\nimport pandas as pd\nimport streamlit as st\n\nfrom core import loader, report\nfrom core.theme import rule\n\nFIELDS = [\"전표번호\", \"회계일자\", \"계정과목\", \"적요\", \"차변금액\", \"입력자\", \"입력일시\"]\n\n\ndef render():\n    up = st.file_uploader(\"총계정원장 (CSV 또는 엑셀)\", type=[\"csv\", \"xlsx\", \"xls\", \"xlsm\"])\n    if up is None:\n        st.info(\"파일을 올리면 컬럼 연결 화면이 나타납니다. \"\n                \"samples/ledger_2025.csv로 먼저 시험해 보셔도 됩니다.\")\n        return\n\n    try:\n        raw = loader.read_any(up)\n    except Exception as e:\n        st.error(f\"파일을 읽지 못했습니다 — {e}\")\n        return\n\n    st.caption(f\"{len(raw):,}행 × {len(raw.columns)}열\")\n    mapping = loader.map_columns(raw, FIELDS)\n    if mapping is None:\n        return\n    df = loader.standardize(raw, mapping).dropna(subset=[\"회계일자\", \"차변금액\"])\n    if df.empty:\n        st.error(\"회계일자 또는 금액을 인식하지 못했습니다. 컬럼 연결을 확인해 주세요.\")\n        return\n\n    rule()\n\n    # ── 적출 기준 ────────────────────────────────────────────\n    st.markdown('<div class=\"section-label\">적출 기준</div>', unsafe_allow_html=True)\n    c1, c2, c3, c4 = st.columns(4)\n    ye_end = df[\"회계일자\"].max().date()\n    with c1:\n        ye_from = st.date_input(\"기말 기준일\", value=ye_end - pd.Timedelta(days=3))\n    with c2:\n        night = st.slider(\"심야 기준 (시)\", 18, 23, 22)\n    with c3:\n        limit = st.number_input(\"승인한도 (원)\", value=10_000_000, step=1_000_000, format=\"%d\")\n    with c4:\n        band = st.slider(\"한도 직하 구간 (%)\", 1, 20, 10,\n                         help=\"한도의 몇 % 아래까지를 회피 의심 구간으로 볼지\")\n\n    picked = st.multiselect(\n        \"실행할 테스트\",\n        [\"기말 심야 입력\", \"승인한도 직하\", \"업무외 시간 입력\", \"중복 계상\", \"금액 상위\"],\n        default=[\"기말 심야 입력\", \"승인한도 직하\", \"중복 계상\", \"금액 상위\"],\n    )\n    if not picked:\n        st.warning(\"테스트를 하나 이상 선택해 주세요.\")\n        return\n\n    rule()\n\n    # ── 실행 ────────────────────────────────────────────────\n    results, floor = {}, limit * (1 - band / 100)\n    ts = pd.Timestamp(ye_from)\n\n    if \"기말 심야 입력\" in picked:\n        results[\"기말 심야 입력\"] = {\n            \"df\": df[(df[\"회계일자\"] >= ts) & (df[\"입력일시\"].dt.hour >= night)],\n            \"basis\": f\"회계일자 {ye_from:%m-%d} 이후 & 입력 {night}시 이후 — 기간귀속 조작 위험\",\n        }\n    if \"승인한도 직하\" in picked:\n        results[\"승인한도 직하\"] = {\n            \"df\": df[(df[\"차변금액\"] >= floor) & (df[\"차변금액\"] < limit)],\n            \"basis\": f\"{floor:,.0f}~{limit:,.0f}원 구간 — 한도 회피 분할발행 가능성\",\n        }\n    if \"업무외 시간 입력\" in picked:\n        results[\"업무외 시간 입력\"] = {\n            \"df\": df[df[\"입력일시\"].dt.weekday >= 5],\n            \"basis\": \"입력일시가 토·일 — 통상 업무시간 외 처리\",\n        }\n    if \"중복 계상\" in picked:\n        key = [\"계정과목\", \"회계일자\", \"차변금액\"]\n        results[\"중복 계상\"] = {\n            \"df\": df[df.duplicated(key, keep=False)].sort_values(key),\n            \"basis\": \"계정·일자·금액 3요소 동일 — 이중계상 가능성\",\n        }\n    if \"금액 상위\" in picked:\n        results[\"금액 상위\"] = {\n            \"df\": df.nlargest(10, \"차변금액\"),\n            \"basis\": \"금액 상위 10건 — 정밀도 기준 개별 검토 대상\",\n        }\n\n    pop_n, pop_amt = len(df), float(df[\"차변금액\"].sum())\n\n    st.markdown('<div class=\"section-label\">적출 결과</div>', unsafe_allow_html=True)\n    cols = st.columns(len(results))\n    for col, (name, res) in zip(cols, results.items()):\n        with col:\n            n = len(res[\"df\"])\n            st.metric(name, f\"{n:,}건\", f\"{n/pop_n*100:.1f}% of 모집단\",\n                      delta_color=\"off\")\n            st.caption(f\"{res['df']['차변금액'].sum():,.0f}원\")\n\n    for name, res in results.items():\n        with st.expander(f\"{name} — {len(res['df']):,}건\"):\n            st.caption(res[\"basis\"])\n            if res[\"df\"].empty:\n                st.write(\"적출 항목 없음\")\n            else:\n                st.dataframe(res[\"df\"].sort_values(\"차변금액\", ascending=False),\n                             use_container_width=True, height=300)\n\n    # ── 벤포드 ──────────────────────────────────────────────\n    rule()\n    st.markdown('<div class=\"section-label\">벤포드 법칙 (첫 자리)</div>', unsafe_allow_html=True)\n    ben, chi = _benford(df[\"차변금액\"])\n    b1, b2 = st.columns([2, 1])\n    with b1:\n        st.bar_chart(ben[[\"실제%\", \"기대%\"]])\n    with b2:\n        st.metric(\"카이제곱 통계량\", f\"{chi:.1f}\")\n        st.caption(\"자유도 8 · 유의수준 5% 임계값 15.5\")\n        st.caption(\"임계값을 넘으면 금액 분포가 자연발생 패턴에서 벗어난 것으로 봅니다. \"\n                   \"다만 국지적 조작은 이 검정으로 잡히지 않습니다.\")\n        st.dataframe(ben, use_container_width=True)\n\n    # ── 조서 내려받기 ────────────────────────────────────────\n    rule()\n    notes = loader.health_check(df)\n    if notes:\n        st.markdown('<div class=\"section-label\">데이터 품질 메모</div>', unsafe_allow_html=True)\n        for n in notes:\n            st.caption(f\"· {n}\")\n\n    xlsx = report.build(results, {\n        \"title\": \"전표 이상징후 분석(JET) 조서\",\n        \"period\": f\"{df['회계일자'].min():%Y-%m-%d} ~ {df['회계일자'].max():%Y-%m-%d}\",\n        \"pop_count\": pop_n,\n        \"pop_amount\": pop_amt,\n        \"notes\": notes,\n    })\n    st.download_button(\"조서 내려받기 (xlsx)\", xlsx,\n                       file_name=f\"JET_{df['회계일자'].max():%Y}.xlsx\",\n                       mime=\"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\")\n\n\ndef _benford(amounts: pd.Series):\n    d = (amounts.abs().astype(str).str.lstrip(\"0.\").str[0]\n         .where(lambda s: s.str.isdigit()).dropna().astype(int))\n    d = d[d.between(1, 9)]\n    obs = d.value_counts(normalize=True).reindex(range(1, 10), fill_value=0).sort_index()\n    exp = pd.Series({i: np.log10(1 + 1 / i) for i in range(1, 10)})\n    n = len(d)\n    chi = float((((obs * n) - (exp * n)) ** 2 / (exp * n)).sum()) if n else 0.0\n    out = pd.DataFrame({\"실제%\": (obs * 100).round(1), \"기대%\": (exp * 100).round(1)})\n    out[\"편차%p\"] = (out[\"실제%\"] - out[\"기대%\"]).round(1)\n    out.index.name = \"첫자리\"\n    return out, chi\n"
};
