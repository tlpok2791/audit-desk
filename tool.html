<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>감사 데스크 — 브라우저에서 실행</title>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css">
<style>
  :root { --indigo:#4F46E5; --ink:#111827; --mute:#6B7280; --bg:#F7F8FC; --line:#E5E7EB; }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { background:var(--bg); font-family:Pretendard,system-ui,-apple-system,sans-serif; }
  #bar { display:flex; align-items:center; gap:14px; padding:11px 20px;
          background:#fff; border-bottom:1px solid var(--line); }
  #bar a { color:var(--mute); text-decoration:none; font-size:13.5px; font-weight:600; }
  #bar a:hover { color:var(--indigo); }
  #bar b { font-size:15px; color:var(--ink); letter-spacing:-.02em; }
  #bar .tag { margin-left:auto; font-size:11.5px; font-weight:600; padding:4px 11px;
               border-radius:999px; background:#D1FAE5; color:#065F46; }
  #boot { max-width:560px; margin:70px auto; padding:0 22px; text-align:center; }
  #boot h2 { font-size:19px; font-weight:800; color:var(--ink); letter-spacing:-.03em; }
  #boot p { font-size:14px; color:var(--mute); margin-top:11px; line-height:1.7; }
  #boot .spin { width:34px; height:34px; margin:0 auto 22px; border-radius:50%;
                 border:3px solid var(--line); border-top-color:var(--indigo);
                 animation:sp .9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg) } }
  #boot .note { margin-top:26px; padding:14px 17px; background:#fff;
                 border:1px solid var(--line); border-radius:12px;
                 font-size:12.5px; color:var(--mute); text-align:left; line-height:1.7; }
  #root { display:none; }
  #root.on { display:block; }
  @media (prefers-reduced-motion:reduce) { #boot .spin { animation:none } }
</style>
</head>
<body>

<div id="bar">
  <a href="./">← 홈</a>
  <b>감사 데스크</b>
  <span class="tag">브라우저에서 실행 · 파일 전송 없음</span>
</div>

<div id="boot">
  <div class="spin"></div>
  <h2>파이썬 실행 환경을 내려받는 중입니다</h2>
  <p>처음 한 번만 약 50MB를 받습니다. 30초에서 1분쯤 걸리고,<br>
     다음부터는 브라우저에 저장된 것을 써서 훨씬 빠릅니다.</p>
  <div class="note">
    <b>파일은 이 브라우저 안에서만 처리됩니다.</b><br>
    파이썬이 서버가 아니라 지금 이 브라우저에서 돌기 때문에,
    올리신 원장이나 분개장은 어디로도 전송되지 않습니다.
    탭을 닫으면 함께 사라집니다.
  </div>
</div>

<div id="root"></div>

<script type="module">
import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

const files = {
  "app.py": "\"\"\"\n감사 데스크 (Audit Desk) — 내부용 분석 도구\n실행: streamlit run app.py\n\"\"\"\nimport streamlit as st\nfrom core.env import in_browser\nfrom core.theme import inject_css, rule, stamp\nfrom core.registry import MODULES\n\nst.set_page_config(page_title=\"감사 데스크\", page_icon=\"▨\", layout=\"wide\")\ninject_css()\n\n# ── 사이드바 ────────────────────────────────────────────────\nwith st.sidebar:\n    st.markdown('<div class=\"brand\">감사<br><span>데스크</span></div>', unsafe_allow_html=True)\n    st.markdown(\n        f'<div class=\"brand-sub\">내부 전용 · '\n        f'{\"브라우저 실행\" if in_browser() else \"로컬 실행\"}</div>',\n        unsafe_allow_html=True)\n    rule()\n\n    choice = st.radio(\n        \"작업 선택\",\n        [\"홈\"] + [m.label for m in MODULES],\n        label_visibility=\"collapsed\",\n    )\n\n    rule()\n    where = (\"이 브라우저 안에서만\" if in_browser() else \"이 PC 메모리에서만\")\n    st.markdown(\n        f'<div class=\"note\">업로드한 파일은 {where} 처리되며 '\n        '어디에도 전송·저장되지 않습니다.</div>',\n        unsafe_allow_html=True,\n    )\n\n# ── 홈 ─────────────────────────────────────────────────────\nif choice == \"홈\":\n    st.markdown('<div class=\"eyebrow\">WORKPAPER TOOLKIT</div>', unsafe_allow_html=True)\n    st.markdown('<h1 class=\"display\">감사 데스크</h1>', unsafe_allow_html=True)\n    st.markdown(\n        '<p class=\"lede\">엑셀을 올리면 조서가 나옵니다. '\n        '반복 작업만 골라 담은 개인 도구함입니다.</p>',\n        unsafe_allow_html=True,\n    )\n    rule()\n\n    ready = [m for m in MODULES if m.status == \"ready\"]\n    draft = [m for m in MODULES if m.status != \"ready\"]\n\n    st.markdown('<div class=\"section-label\">사용 가능</div>', unsafe_allow_html=True)\n    cols = st.columns(max(len(ready), 1))\n    for col, m in zip(cols, ready):\n        with col:\n            st.markdown(\n                f'<div class=\"card\">'\n                f'<div class=\"card-ref\">{m.ref}</div>'\n                f'<div class=\"card-title\">{m.label}</div>'\n                f'<div class=\"card-desc\">{m.desc}</div>'\n                f'{stamp(\"가동\")}'\n                f\"</div>\",\n                unsafe_allow_html=True,\n            )\n\n    if draft:\n        st.markdown('<div class=\"section-label\">예정</div>', unsafe_allow_html=True)\n        cols = st.columns(min(len(draft), 3) or 1)\n        for i, m in enumerate(draft):\n            with cols[i % len(cols)]:\n                st.markdown(\n                    f'<div class=\"card card-dim\">'\n                    f'<div class=\"card-ref\">{m.ref}</div>'\n                    f'<div class=\"card-title\">{m.label}</div>'\n                    f'<div class=\"card-desc\">{m.desc}</div>'\n                    f\"</div>\",\n                    unsafe_allow_html=True,\n                )\n\n    rule()\n    st.markdown(\n        '<div class=\"note\">모듈을 추가하려면 <code>modules/</code>에 파일을 만들고 '\n        '<code>core/registry.py</code>에 한 줄 등록하면 사이드바에 바로 나타납니다.</div>',\n        unsafe_allow_html=True,\n    )\n\n# ── 모듈 실행 ───────────────────────────────────────────────\nelse:\n    mod = next(m for m in MODULES if m.label == choice)\n    st.markdown(f'<div class=\"eyebrow\">{mod.ref}</div>', unsafe_allow_html=True)\n    st.markdown(f'<h1 class=\"display\">{mod.label}</h1>', unsafe_allow_html=True)\n    st.markdown(f'<p class=\"lede\">{mod.desc}</p>', unsafe_allow_html=True)\n    rule()\n    mod.render()\n",
  "core/__init__.py": "",
  "core/env.py": "\"\"\"실행 환경 판별 — 브라우저(Pyodide)인지 로컬 PC인지.\"\"\"\nimport sys\n\n\ndef in_browser() -> bool:\n    \"\"\"stlite/Pyodide 위에서 도는 중인지.\"\"\"\n    return sys.platform == \"emscripten\"\n\n\n# 브라우저에서 이 크기를 넘으면 경고한다 (바이트)\nBROWSER_WARN_BYTES = 5 * 1024 * 1024\nBROWSER_HARD_BYTES = 25 * 1024 * 1024\n\n\ndef size_guard(uploaded) -> str | None:\n    \"\"\"\n    업로드 파일이 브라우저에서 감당 가능한 크기인지.\n    돌려주는 값: None(문제없음) | \"warn\" | \"hard\"\n    \"\"\"\n    if not in_browser() or uploaded is None:\n        return None\n    size = getattr(uploaded, \"size\", None)\n    if size is None:\n        return None\n    if size >= BROWSER_HARD_BYTES:\n        return \"hard\"\n    if size >= BROWSER_WARN_BYTES:\n        return \"warn\"\n    return None\n",
  "core/theme.py": "\"\"\"조서(workpaper) 문법을 옮긴 시각 언어 — 괘선, 참조번호, 적출 표식.\"\"\"\nimport streamlit as st\n\nINK = \"#16202E\"      # 조서 본문\nPAPER = \"#FBFAF6\"    # 조서 용지\nRULE = \"#C9C6BA\"     # 괘선\nMARK = \"#B3261E\"     # 감사인의 적색 표기\nSLATE = \"#6B7280\"    # 보조 텍스트\nTICK = \"#1F6F5C\"     # 확인 완료\n\nCSS = f\"\"\"\n<style>\n@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap');\n\nhtml, body, [class*=\"css\"] {{ font-family:'IBM Plex Sans KR',sans-serif; }}\n.stApp {{ background:{PAPER}; color:{INK}; }}\n\n/* 사이드바 */\nsection[data-testid=\"stSidebar\"] {{ background:{INK}; }}\nsection[data-testid=\"stSidebar\"] * {{ color:#E8E6DF; }}\n.brand {{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:600;\n         line-height:1.05; letter-spacing:-.02em; }}\n.brand span {{ color:{RULE}; font-weight:400; }}\n.brand-sub {{ font-size:11px; color:#8A8F98; letter-spacing:.08em; margin-top:6px; }}\n\n/* 표제 */\n.eyebrow {{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.18em;\n           color:{MARK}; margin-bottom:2px; }}\nh1.display {{ font-family:'IBM Plex Mono',monospace; font-size:34px; font-weight:600;\n              letter-spacing:-.03em; margin:0 0 6px; color:{INK}; }}\n.lede {{ font-size:14px; color:{SLATE}; max-width:56ch; margin:0; }}\n.section-label {{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;\n                  color:{SLATE}; margin:22px 0 10px; }}\n\n/* 괘선 — 조서 상하단 이중선 */\n.rule {{ border:0; border-top:1px solid {INK}; border-bottom:1px solid {RULE};\n        height:3px; margin:18px 0; }}\n\n/* 모듈 카드 */\n.card {{ background:#fff; border:1px solid {RULE}; border-left:3px solid {INK};\n        padding:16px 18px; height:100%; }}\n.card-dim {{ border-left-color:{RULE}; opacity:.55; }}\n.card-ref {{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:{MARK};\n            letter-spacing:.1em; }}\n.card-title {{ font-size:16px; font-weight:600; margin:4px 0 6px; }}\n.card-desc {{ font-size:13px; color:{SLATE}; line-height:1.5; }}\n.stamp {{ display:inline-block; margin-top:12px; font-family:'IBM Plex Mono',monospace;\n         font-size:10px; letter-spacing:.14em; color:{TICK};\n         border:1px solid {TICK}; padding:2px 7px; }}\n\n/* 지표 */\n[data-testid=\"stMetricValue\"] {{ font-family:'IBM Plex Mono',monospace; font-size:24px; }}\n[data-testid=\"stMetricLabel\"] {{ font-size:12px; color:{SLATE}; }}\n\n/* 표 — 숫자는 등폭으로 */\n[data-testid=\"stDataFrame\"] {{ font-family:'IBM Plex Mono',monospace; font-size:12px; }}\n\n.note {{ font-size:12px; color:{SLATE}; line-height:1.6; }}\n.note code {{ background:#EFEDE6; padding:1px 5px; font-size:11px; }}\n\n.stButton>button, .stDownloadButton>button {{\n    background:{INK}; color:{PAPER}; border:0; border-radius:0;\n    font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:.04em; }}\n.stButton>button:hover, .stDownloadButton>button:hover {{ background:{MARK}; color:#fff; }}\n</style>\n\"\"\"\n\n\ndef inject_css():\n    st.markdown(CSS, unsafe_allow_html=True)\n\n\ndef rule():\n    st.markdown('<div class=\"rule\"></div>', unsafe_allow_html=True)\n\n\ndef stamp(text: str) -> str:\n    return f'<span class=\"stamp\">{text}</span>'\n",
  "core/registry.py": "\"\"\"\n모듈 등록부.\n\n새 기능을 붙이는 법:\n  1. modules/ 아래에 파일을 만들고 render() 함수를 정의한다\n  2. 아래 MODULES 목록에 Module(...) 한 줄을 추가한다\n  3. 끝. 사이드바와 홈 카드에 자동으로 나타난다\n\"\"\"\nfrom dataclasses import dataclass\nfrom typing import Callable\n\nfrom modules import fs, jet, journal_edit, ledger_edit, lead, stub\n\n\n@dataclass\nclass Module:\n    ref: str                 # 조서 참조번호\n    label: str               # 메뉴에 표시될 이름\n    desc: str                # 한 줄 설명\n    render: Callable         # 화면을 그리는 함수\n    status: str = \"draft\"    # \"ready\" | \"draft\"\n\n\nMODULES = [\n    Module(\n        ref=\"LG-100\",\n        label=\"계정별원장 편집\",\n        desc=\"계정마다 나뉜 시트를 계정과목 열을 가진 하나의 통합 원장으로 합치고, \"\n             \"원장에 찍힌 [누계]와 대조해 검증합니다.\",\n        render=ledger_edit.render,\n        status=\"ready\",\n    ),\n    Module(\n        ref=\"JN-100\",\n        label=\"분개장 편집\",\n        desc=\"회계프로그램에서 뽑은 분개장을 서식과 무관하게 표준 형태로 펴고, \"\n             \"차변·대변 합계가 일치하는지 검증합니다.\",\n        render=journal_edit.render,\n        status=\"ready\",\n    ),\n    Module(\n        ref=\"WP-300\",\n        label=\"조서 작성\",\n        desc=\"시산표를 올리면 표지와 계정그룹별 리드시트를 참조번호·검토표시란까지 \"\n             \"갖춘 엑셀로 만들어 줍니다.\",\n        render=lead.render,\n        status=\"ready\",\n    ),\n    Module(\n        ref=\"FS-200\",\n        label=\"재무제표 분석\",\n        desc=\"2개년 시산표로 증감분석과 비율분석을 돌리고, 유의적 변동에 대한 \"\n             \"코멘트 초안까지 뽑습니다.\",\n        render=fs.render,\n        status=\"ready\",\n    ),\n    Module(\n        ref=\"JE-100\",\n        label=\"전표 이상징후 분석\",\n        desc=\"총계정원장에서 기말 심야전표, 승인한도 직하, 중복 계상, \"\n             \"벤포드 편차를 적출합니다.\",\n        render=jet.render,\n        status=\"ready\",\n    ),\n    # ── 아래는 자리만 잡아둔 것. 만들 때 status를 \"ready\"로 바꾸면 됩니다 ──\n    Module(\n        ref=\"RC-400\",\n        label=\"계정 대사\",\n        desc=\"총계정원장과 보조부·은행거래내역을 대사해 미일치 항목만 추립니다.\",\n        render=stub.make(\"계정 대사\"),\n    ),\n    Module(\n        ref=\"SM-500\",\n        label=\"표본 추출\",\n        desc=\"금액가중(MUS) 또는 무작위 표본을 뽑고 추출 근거를 함께 기록합니다.\",\n        render=stub.make(\"표본 추출\"),\n    ),\n]\n",
  "core/loader.py": "\"\"\"업로드 파일을 읽고, 회사마다 다른 컬럼명을 표준 이름에 연결한다.\"\"\"\nimport pandas as pd\nimport streamlit as st\n\n# 표준 필드 → 흔히 쓰이는 컬럼명 후보\nGUESS = {\n    \"전표번호\": [\"전표번호\", \"전표NO\", \"번호\", \"doc_no\", \"voucher\"],\n    \"회계일자\": [\"회계일자\", \"전표일자\", \"거래일자\", \"일자\", \"date\"],\n    \"계정과목\": [\"계정과목\", \"계정명\", \"계정\", \"account\"],\n    \"적요\": [\"적요\", \"비고\", \"내용\", \"memo\", \"description\"],\n    \"차변금액\": [\"차변금액\", \"차변\", \"금액\", \"debit\", \"amount\"],\n    \"입력자\": [\"입력자\", \"작성자\", \"담당자\", \"user\", \"created_by\"],\n    \"입력일시\": [\"입력일시\", \"등록일시\", \"작성일시\", \"created_at\"],\n}\n\n\ndef read_any(file) -> pd.DataFrame:\n    \"\"\"CSV(한글 인코딩 자동) 또는 엑셀을 읽는다.\"\"\"\n    name = file.name.lower()\n    if name.endswith((\".xlsx\", \".xls\", \".xlsm\")):\n        return pd.read_excel(file)\n    for enc in (\"utf-8-sig\", \"cp949\", \"utf-8\"):\n        try:\n            file.seek(0)\n            return pd.read_csv(file, encoding=enc)\n        except UnicodeDecodeError:\n            continue\n    raise ValueError(\"인코딩을 인식하지 못했습니다. UTF-8 또는 CP949로 저장해 주세요.\")\n\n\ndef _guess(field: str, columns: list[str]) -> int:\n    for cand in GUESS.get(field, []):\n        for i, c in enumerate(columns):\n            if str(c).replace(\" \", \"\").lower() == cand.replace(\" \", \"\").lower():\n                return i\n    return 0\n\n\ndef map_columns(df: pd.DataFrame, required: list[str]) -> dict | None:\n    \"\"\"사용자에게 컬럼 연결을 확인받는다. 이름이 달라도 쓸 수 있게.\"\"\"\n    cols = list(df.columns)\n    st.markdown('<div class=\"section-label\">컬럼 연결</div>', unsafe_allow_html=True)\n    st.caption(\"자동으로 맞춰둔 값을 확인하고, 다르면 바꿔주세요.\")\n\n    mapping = {}\n    grid = st.columns(min(len(required), 4))\n    for i, field in enumerate(required):\n        with grid[i % len(grid)]:\n            mapping[field] = st.selectbox(field, cols, index=_guess(field, cols), key=f\"map_{field}\")\n\n    if len(set(mapping.values())) != len(mapping):\n        st.error(\"같은 컬럼이 두 곳에 연결됐습니다. 하나씩 다르게 지정해 주세요.\")\n        return None\n    return mapping\n\n\ndef rename(df: pd.DataFrame, mapping: dict) -> pd.DataFrame:\n    \"\"\"매핑에 따라 필요한 컬럼만 뽑아 표준 이름으로 바꾼다.\"\"\"\n    out = df[list(mapping.values())].copy()\n    out.columns = list(mapping.keys())\n    return out\n\n\ndef to_number(s: pd.Series) -> pd.Series:\n    \"\"\"'1,234,000원', '(1,234)', ' - ' 같은 표기를 숫자로.\"\"\"\n    t = (s.astype(str)\n         .str.replace(r\"[,\\s원₩]\", \"\", regex=True)\n         .str.replace(r\"^\\((.*)\\)$\", r\"-\\1\", regex=True)\n         .replace({\"-\": \"0\", \"\": \"0\", \"nan\": None, \"None\": None}))\n    return pd.to_numeric(t, errors=\"coerce\")\n\n\ndef standardize_numeric(df: pd.DataFrame, cols: list[str]) -> pd.DataFrame:\n    out = df.copy()\n    for c in cols:\n        if c in out:\n            out[c] = to_number(out[c])\n    return out\n\n\ndef standardize(df: pd.DataFrame, mapping: dict) -> pd.DataFrame:\n    \"\"\"표준 컬럼명으로 바꾸고 자료형을 정리한다.\"\"\"\n    out = df[list(mapping.values())].copy()\n    out.columns = list(mapping.keys())\n\n    for c in (\"회계일자\", \"입력일시\"):\n        if c in out:\n            out[c] = pd.to_datetime(out[c], errors=\"coerce\")\n    if \"차변금액\" in out:\n        out[\"차변금액\"] = (\n            out[\"차변금액\"].astype(str)\n            .str.replace(r\"[,\\s원]\", \"\", regex=True)\n            .str.replace(r\"^\\((.*)\\)$\", r\"-\\1\", regex=True)\n        )\n        out[\"차변금액\"] = pd.to_numeric(out[\"차변금액\"], errors=\"coerce\")\n    return out\n\n\ndef health_check(df: pd.DataFrame) -> list[str]:\n    \"\"\"조서에 남길 데이터 품질 메모.\"\"\"\n    notes = []\n    for c in df.columns:\n        n = int(df[c].isna().sum())\n        if n:\n            notes.append(f\"{c} 결측 {n:,}건 — 해당 행은 테스트에서 제외됩니다.\")\n    if \"차변금액\" in df and (df[\"차변금액\"] < 0).any():\n        notes.append(f\"음수 금액 {int((df['차변금액'] < 0).sum()):,}건 — 반제·취소 전표일 수 있습니다.\")\n    if \"회계일자\" in df and df[\"회계일자\"].notna().any():\n        span = df[\"회계일자\"].dropna()\n        notes.append(f\"회계일자 범위 {span.min():%Y-%m-%d} ~ {span.max():%Y-%m-%d}\")\n    return notes\n",
  "core/accounts.py": "\"\"\"계정과목 이름으로 재무제표 구분을 추정한다. 회사마다 계정명이 달라 규칙은 보수적으로.\"\"\"\nimport pandas as pd\n\n# (구분, 세부구분, 키워드) — 앞에 오는 규칙이 우선한다\nRULES = [\n    (\"자산\", \"유동자산\", [\"현금\", \"예금\", \"제예금\", \"단기금융\", \"단기투자\", \"매출채권\", \"받을어음\",\n                        \"대손충당금\", \"미수금\", \"미수수익\", \"선급금\", \"선급비용\", \"재고자산\",\n                        \"상품\", \"제품\", \"재공품\", \"원재료\", \"저장품\", \"미착품\", \"단기대여금\",\n                        \"부가세대급금\", \"선납세금\"]),\n    (\"자산\", \"비유동자산\", [\"토지\", \"건물\", \"구축물\", \"기계장치\", \"차량운반구\", \"비품\", \"공구\",\n                          \"건설중인자산\", \"감가상각누계\", \"무형자산\", \"영업권\", \"개발비\",\n                          \"소프트웨어\", \"산업재산권\", \"보증금\", \"장기대여금\", \"투자부동산\",\n                          \"장기금융\", \"지분법\", \"이연법인세자산\", \"매도가능\"]),\n    (\"부채\", \"유동부채\", [\"매입채무\", \"지급어음\", \"미지급금\", \"미지급비용\", \"예수금\", \"선수금\",\n                        \"선수수익\", \"단기차입금\", \"유동성장기\", \"미지급법인세\", \"부가세예수금\",\n                        \"단기충당\"]),\n    (\"부채\", \"비유동부채\", [\"장기차입금\", \"사채\", \"퇴직급여충당\", \"장기미지급\", \"이연법인세부채\",\n                          \"장기충당\", \"리스부채\"]),\n    (\"자본\", \"자본\", [\"자본금\", \"자본잉여금\", \"주식발행초과금\", \"이익잉여금\", \"결손금\", \"자기주식\",\n                    \"기타포괄\", \"자본조정\"]),\n    # 매출원가가 '매출'을 포함하므로 반드시 매출보다 먼저 판정한다\n    (\"손익\", \"매출원가\", [\"매출원가\", \"제조원가\", \"공사원가\", \"상품매출원가\"]),\n    (\"손익\", \"매출\", [\"매출액\", \"매출\", \"용역수익\", \"공사수익\", \"영업수익\"]),\n    (\"손익\", \"영업외수익\", [\"이자수익\", \"배당금수익\", \"외환차익\", \"외화환산이익\", \"잡이익\",\n                          \"처분이익\", \"평가이익\", \"수입임대료\", \"환입\"]),\n    (\"손익\", \"영업외비용\", [\"이자비용\", \"외환차손\", \"외화환산손실\", \"기부금\", \"잡손실\",\n                          \"처분손실\", \"평가손실\"]),\n    (\"손익\", \"법인세\", [\"법인세\"]),\n    (\"손익\", \"판매비와관리비\", [\"급여\", \"임금\", \"상여\", \"제수당\", \"퇴직급여\", \"복리후생\", \"여비\",\n                             \"교통비\", \"접대비\", \"기업업무추진\", \"통신비\", \"수도광열\", \"전력비\",\n                             \"세금과공과\", \"감가상각\", \"무형자산상각\", \"지급임차료\", \"임차료\",\n                             \"수선비\", \"보험료\", \"차량유지\", \"운반비\", \"교육훈련\", \"도서인쇄\",\n                             \"소모품비\", \"지급수수료\", \"광고선전\", \"대손상각\", \"판매촉진\",\n                             \"회의비\", \"잡비\", \"연구비\", \"경상개발\"]),\n]\n\nORDER = [\"유동자산\", \"비유동자산\", \"유동부채\", \"비유동부채\", \"자본\",\n         \"매출\", \"매출원가\", \"판매비와관리비\", \"영업외수익\", \"영업외비용\", \"법인세\", \"미분류\"]\n\n\ndef classify_one(name: str) -> tuple[str, str]:\n    s = str(name).replace(\" \", \"\")\n    for group, sub, keys in RULES:\n        for k in keys:\n            if k in s:\n                return group, sub\n    return \"미분류\", \"미분류\"\n\n\ndef classify(df: pd.DataFrame, col: str = \"계정과목\") -> pd.DataFrame:\n    out = df.copy()\n    pairs = out[col].map(classify_one)\n    out[\"구분\"] = [p[0] for p in pairs]\n    out[\"세부구분\"] = [p[1] for p in pairs]\n    out[\"세부구분\"] = pd.Categorical(out[\"세부구분\"], categories=ORDER, ordered=True)\n    return out\n\n\ndef subtotal(df: pd.DataFrame, sub: str, col: str) -> float:\n    \"\"\"세부구분 합계. 없으면 0.\"\"\"\n    m = df[df[\"세부구분\"] == sub]\n    return float(m[col].sum()) if len(m) else 0.0\n\n\ndef find(df: pd.DataFrame, keyword: str, col: str) -> float:\n    \"\"\"계정명에 키워드가 든 계정의 합계.\"\"\"\n    m = df[df[\"계정과목\"].astype(str).str.replace(\" \", \"\").str.contains(keyword, na=False)]\n    return float(m[col].sum()) if len(m) else 0.0\n\n\ndef josa(word: str, pair: str = \"이/가\") -> str:\n    \"\"\"받침 유무에 따라 조사를 고른다. pair는 '이/가', '은/는', '을/를'.\"\"\"\n    a, b = pair.split(\"/\")\n    w = str(word).rstrip(\")]』」』 \").strip()\n    if not w:\n        return b\n    ch = w[-1]\n    if \"가\" <= ch <= \"힣\":\n        return a if (ord(ch) - 0xAC00) % 28 else b\n    if ch.isdigit():\n        return a if ch in \"0136780\" else b\n    return a\n",
  "core/report.py": "\"\"\"적출 결과를 감사조서 형식 엑셀로 내보낸다.\"\"\"\nimport io\nfrom datetime import datetime\n\nimport numpy as np\nimport pandas as pd\nfrom openpyxl import Workbook\nfrom openpyxl.styles import Alignment, Border, Font, PatternFill, Side\nfrom openpyxl.utils import get_column_letter\n\nFONT = \"Arial\"\nHDR = PatternFill(\"solid\", fgColor=\"16202E\")\nSUB = PatternFill(\"solid\", fgColor=\"E8E6DF\")\n_thin = Side(style=\"thin\", color=\"C9C6BA\")\nBOX = Border(left=_thin, right=_thin, top=_thin, bottom=_thin)\n\n\ndef build(results: dict, meta: dict) -> bytes:\n    \"\"\"\n    results: {테스트명: {\"df\": DataFrame, \"basis\": 판단근거 문자열}}\n    meta   : {\"title\", \"period\", \"pop_count\", \"pop_amount\", \"notes\": [str]}\n    \"\"\"\n    wb = Workbook()\n    ws = wb.active\n    ws.title = \"요약\"\n\n    ws[\"A1\"] = meta[\"title\"]\n    ws[\"A1\"].font = Font(FONT, size=14, bold=True)\n    ws[\"A2\"] = (f\"대상기간 {meta['period']} · 모집단 {meta['pop_count']:,}건 / \"\n                f\"{meta['pop_amount']:,.0f}원 · 작성 {datetime.now():%Y-%m-%d %H:%M}\")\n    ws[\"A2\"].font = Font(FONT, size=9, italic=True, color=\"6B7280\")\n\n    headers = [\"테스트 항목\", \"적출 건수\", \"적출 금액\", \"건수 비율\", \"금액 비율\", \"판단 근거\"]\n    for c, h in enumerate(headers, 1):\n        cell = ws.cell(4, c, h)\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.alignment = Alignment(\"center\", \"center\")\n        cell.border = BOX\n\n    row = 5\n    for name, res in results.items():\n        d = res[\"df\"]\n        amt = float(d[\"차변금액\"].sum()) if len(d) and \"차변금액\" in d else 0.0\n        ws.cell(row, 1, name).font = Font(FONT, bold=True)\n        ws.cell(row, 2, len(d))\n        ws.cell(row, 3, amt)\n        ws.cell(row, 4, f\"=IF({meta['pop_count']}=0,0,B{row}/{meta['pop_count']})\")\n        ws.cell(row, 5, f\"=IF({meta['pop_amount']}=0,0,C{row}/{meta['pop_amount']})\")\n        ws.cell(row, 6, res[\"basis\"]).font = Font(FONT, size=9)\n        for c in range(1, 7):\n            ws.cell(row, c).border = BOX\n        ws.cell(row, 2).number_format = \"#,##0\"\n        ws.cell(row, 3).number_format = \"#,##0;(#,##0);-\"\n        ws.cell(row, 4).number_format = \"0.0%\"\n        ws.cell(row, 5).number_format = \"0.0%\"\n        row += 1\n\n    ws.cell(row, 1, \"합계 (테스트 간 중복 포함)\").font = Font(FONT, bold=True)\n    ws.cell(row, 2, f\"=SUM(B5:B{row-1})\").font = Font(FONT, bold=True)\n    ws.cell(row, 3, f\"=SUM(C5:C{row-1})\").font = Font(FONT, bold=True)\n    ws.cell(row, 2).number_format = \"#,##0\"\n    ws.cell(row, 3).number_format = \"#,##0\"\n    for c in range(1, 7):\n        ws.cell(row, c).fill = SUB\n        ws.cell(row, c).border = BOX\n\n    row += 2\n    ws.cell(row, 1, \"데이터 품질 메모\").font = Font(FONT, bold=True, size=10)\n    for note in meta.get(\"notes\", []) or [\"특이사항 없음\"]:\n        row += 1\n        ws.cell(row, 1, f\"· {note}\").font = Font(FONT, size=9, color=\"6B7280\")\n\n    for col, width in zip(\"ABCDEF\", [24, 12, 18, 12, 12, 60]):\n        ws.column_dimensions[col].width = width\n\n    for name, res in results.items():\n        _detail_sheet(wb, name[:31], res[\"df\"])\n\n    buf = io.BytesIO()\n    wb.save(buf)\n    return buf.getvalue()\n\n\ndef _detail_sheet(wb: Workbook, title: str, df: pd.DataFrame):\n    ws = wb.create_sheet(title)\n    if df.empty:\n        ws[\"A1\"] = \"적출 항목 없음\"\n        ws[\"A1\"].font = Font(FONT, italic=True, color=\"6B7280\")\n        return\n\n    out = df.copy()\n    for c in out.columns:\n        if pd.api.types.is_datetime64_any_dtype(out[c]):\n            out[c] = out[c].dt.strftime(\"%Y-%m-%d %H:%M\").str.replace(\" 00:00\", \"\", regex=False)\n\n    for c, h in enumerate(out.columns, 1):\n        cell = ws.cell(1, c, str(h))\n        cell.font = Font(FONT, bold=True, color=\"FFFFFF\")\n        cell.fill = HDR\n        cell.alignment = Alignment(\"center\", \"center\")\n        cell.border = BOX\n\n    for i, (_, r) in enumerate(out.iterrows(), 2):\n        for c, v in enumerate(r, 1):\n            val = float(v) if isinstance(v, (int, float, np.number)) and not pd.isna(v) else (\n                \"\" if pd.isna(v) else v)\n            cell = ws.cell(i, c, val)\n            cell.font = Font(FONT, size=10)\n            cell.border = BOX\n            if isinstance(val, float):\n                cell.number_format = \"#,##0\"\n\n    ws.freeze_panes = \"A2\"\n    ws.auto_filter.ref = f\"A1:{get_column_letter(len(out.columns))}{len(out)+1}\"\n    for c in range(1, len(out.columns) + 1):\n        longest = max([len(str(out.columns[c-1]))] +\n                      [len(str(x)) for x in out.iloc[:, c-1].head(200)])\n        ws.column_dimensions[get_column_letter(c)].width = min(max(longest + 3, 11), 40)\n",
  "core/journal.py": "\"\"\"\n분개장 정규화 엔진.\n\n회계프로그램마다 서식이 다른 분개장을 하나의 표준 형태로 편다.\n- 병합셀 흔적(빈 전표번호·일자) → 위 값으로 채움\n- 소계·합계·페이지 머리글 행 → 제거\n- 금액 문자열(\"1,234,000\", \"(1,234)\", \"-\") → 숫자\n- 차대가 한 컬럼에 부호로 들어온 경우 → 차변·대변 두 컬럼으로 분리\n\"\"\"\nimport re\n\nimport numpy as np\nimport pandas as pd\n\n# 표준 컬럼 — 산출물은 항상 이 순서\nSTD = [\"전표일자\", \"전표번호\", \"계정코드\", \"계정과목\", \"거래처\", \"적요\", \"차변\", \"대변\", \"작성자\"]\n\n# 표준 필드 → 흔히 쓰이는 컬럼명 후보 (공백·대소문자 무시하고 비교)\nGUESS = {\n    \"전표일자\": [\"전표일자\", \"회계일자\", \"거래일자\", \"일자\", \"날짜\", \"전표일\", \"date\", \"docdate\"],\n    \"전표번호\": [\"전표번호\", \"전표no\", \"전표번호no\", \"docno\", \"voucherno\", \"번호\", \"전표\"],\n    \"계정코드\": [\"계정코드\", \"계정cd\", \"계정과목코드\", \"코드\", \"acctcd\", \"accountcode\"],\n    \"계정과목\": [\"계정과목\", \"계정명\", \"계정\", \"account\", \"acctname\", \"과목\"],\n    \"거래처\": [\"거래처\", \"거래처명\", \"거래처코드명\", \"상호\", \"vendor\", \"partner\"],\n    \"적요\": [\"적요\", \"비고\", \"내용\", \"메모\", \"memo\", \"description\", \"remark\"],\n    \"차변\": [\"차변\", \"차변금액\", \"차변액\", \"debit\", \"dr\"],\n    \"대변\": [\"대변\", \"대변금액\", \"대변액\", \"credit\", \"cr\"],\n    \"작성자\": [\"작성자\", \"입력자\", \"담당자\", \"등록자\", \"user\", \"createdby\"],\n    # 아래 둘은 표준 컬럼이 아니라 '분리형' 서식을 다룰 때만 쓴다\n    \"금액\": [\"금액\", \"거래금액\", \"amount\", \"amt\", \"발생액\"],\n    \"차대구분\": [\"차대\", \"차대구분\", \"구분\", \"drcr\", \"차변대변\"],\n}\n\n# 이런 문구가 들어간 행은 데이터가 아니라 소계·머리글이다\nNOISE = [\"전표계\", \"소계\", \"합계\", \"총계\", \"누계\", \"이월\", \"페이지\", \"page\",\n         \"계정별원장\", \"분개장\", \"총계정원장\", \"출력일\", \"회사명\", \"사업자\"]\n\n\ndef _norm(s) -> str:\n    return re.sub(r\"[\\s()\\[\\]._-]\", \"\", str(s)).lower()\n\n\ndef guess_mapping(columns) -> dict:\n    \"\"\"컬럼명을 보고 표준 필드에 자동 연결한다. 못 찾으면 키가 빠진다.\"\"\"\n    norm = {_norm(c): c for c in columns}\n    out = {}\n    for field, cands in GUESS.items():\n        for cand in cands:\n            key = _norm(cand)\n            if key in norm:\n                out[field] = norm[key]\n                break\n    return out\n\n\ndef find_header_row(raw: pd.DataFrame, scan: int = 15) -> int:\n    \"\"\"\n    회사 정보가 위에 몇 줄 붙은 파일에서 진짜 머리글 행을 찾는다.\n    표준 필드에 가장 많이 맞아떨어지는 행을 고른다.\n    \"\"\"\n    best, best_hit = -1, 0\n    for i in range(min(scan, len(raw))):\n        vals = [v for v in raw.iloc[i].tolist() if pd.notna(v) and str(v).strip()]\n        if len(vals) < 3:\n            continue\n        hit = len(guess_mapping(vals))\n        if hit > best_hit:\n            best, best_hit = i, hit\n    return best if best_hit >= 3 else -1\n\n\ndef to_number(s: pd.Series) -> pd.Series:\n    \"\"\"'1,234,000' · '(1,234)' · '-' · '' → 숫자.\"\"\"\n    t = (s.astype(str)\n         .str.strip()\n         .str.replace(r\"[,\\s원₩]\", \"\", regex=True)\n         .str.replace(r\"^\\((.*)\\)$\", r\"-\\1\", regex=True))\n    t = t.replace({\"-\": \"0\", \"\": \"0\", \"nan\": \"0\", \"None\": \"0\", \"NaN\": \"0\"})\n    return pd.to_numeric(t, errors=\"coerce\").fillna(0.0)\n\n\ndef drop_noise(df: pd.DataFrame, mapping: dict) -> tuple[pd.DataFrame, int]:\n    \"\"\"소계·합계·반복 머리글 행을 걷어낸다.\"\"\"\n    text_cols = [mapping[f] for f in (\"계정과목\", \"적요\", \"전표번호\", \"거래처\")\n                 if f in mapping and mapping[f] in df.columns]\n    if not text_cols:\n        return df, 0\n\n    joined = df[text_cols].apply(\n        lambda col: col.map(lambda v: \"\" if pd.isna(v) else str(v))).agg(\" \".join, axis=1)\n    key = joined.map(_norm)\n    mask = pd.Series(False, index=df.index)\n    for w in NOISE:\n        mask |= key.str.contains(_norm(w), na=False)\n\n    # 머리글이 다시 등장한 행 (셀 값이 컬럼명과 같음)\n    hdr_names = {_norm(v) for v in mapping.values()}\n    for c in text_cols:\n        mask |= df[c].map(lambda v: _norm(v) in hdr_names if pd.notna(v) else False)\n\n    return df[~mask].copy(), int(mask.sum())\n\n\ndef normalize(raw: pd.DataFrame, mapping: dict, fill_down: bool = True) -> pd.DataFrame:\n    \"\"\"어떤 서식이든 표준 컬럼 형태로 편다.\"\"\"\n    df = raw.copy()\n    df, _ = drop_noise(df, mapping)\n\n    out = pd.DataFrame(index=df.index)\n\n    # 텍스트 계열\n    for f in (\"전표일자\", \"전표번호\", \"계정코드\", \"계정과목\", \"거래처\", \"적요\", \"작성자\"):\n        out[f] = df[mapping[f]] if f in mapping and mapping[f] in df.columns else \"\"\n\n    # 병합셀 흔적 → 위 값으로 채움 (전표번호·일자만)\n    if fill_down:\n        for f in (\"전표번호\", \"전표일자\"):\n            s = out[f].replace(r\"^\\s*$\", np.nan, regex=True)\n            out[f] = s.ffill()\n\n    # 금액 — 두 가지 서식\n    if \"차변\" in mapping and \"대변\" in mapping:\n        out[\"차변\"] = to_number(df[mapping[\"차변\"]])\n        out[\"대변\"] = to_number(df[mapping[\"대변\"]])\n    elif \"금액\" in mapping:\n        amt = to_number(df[mapping[\"금액\"]])\n        if \"차대구분\" in mapping and mapping[\"차대구분\"] in df.columns:\n            g = df[mapping[\"차대구분\"]].astype(str).str.strip()\n            is_dr = g.str.contains(\"차\", na=False) | g.str.upper().str.startswith(\"D\")\n            out[\"차변\"] = np.where(is_dr, amt.abs(), 0.0)\n            out[\"대변\"] = np.where(is_dr, 0.0, amt.abs())\n        else:  # 부호로만 구분된 경우: 양수=차변\n            out[\"차변\"] = np.where(amt >= 0, amt, 0.0)\n            out[\"대변\"] = np.where(amt < 0, -amt, 0.0)\n    else:\n        out[\"차변\"] = 0.0\n        out[\"대변\"] = 0.0\n\n    out[\"전표일자\"] = pd.to_datetime(out[\"전표일자\"], errors=\"coerce\")\n    for f in (\"전표번호\", \"계정코드\", \"계정과목\", \"거래처\", \"적요\", \"작성자\"):\n        out[f] = out[f].astype(str).replace({\"nan\": \"\", \"None\": \"\", \"NaT\": \"\"}).str.strip()\n\n    # 금액이 양쪽 다 0인 행은 데이터가 아니다\n    out = out[(out[\"차변\"] != 0) | (out[\"대변\"] != 0)]\n    return out[STD].reset_index(drop=True)\n\n\n# ── 검증 ────────────────────────────────────────────────────\ndef verify(df: pd.DataFrame, fy_end: pd.Timestamp | None = None) -> dict:\n    \"\"\"차대 일치 및 데이터 품질 검증.\"\"\"\n    dr, cr = float(df[\"차변\"].sum()), float(df[\"대변\"].sum())\n    diff = dr - cr\n\n    # 전표 단위 대차평형 — 총계가 맞아도 전표별로 틀릴 수 있다\n    by = df.groupby(\"전표번호\", dropna=False).agg(\n        차변=(\"차변\", \"sum\"), 대변=(\"대변\", \"sum\"), 행수=(\"차변\", \"size\"))\n    by[\"차이\"] = by[\"차변\"] - by[\"대변\"]\n    unbal = by[by[\"차이\"].abs() >= 1].reset_index()\n\n    checks = []\n    checks.append({\n        \"항목\": \"총 차변 = 총 대변\",\n        \"결과\": \"일치\" if abs(diff) < 1 else \"불일치\",\n        \"내용\": f\"차변 {dr:,.0f} / 대변 {cr:,.0f}\" + (\"\" if abs(diff) < 1 else f\" / 차이 {diff:,.0f}\"),\n    })\n    checks.append({\n        \"항목\": \"전표별 대차평형\",\n        \"결과\": \"일치\" if unbal.empty else \"불일치\",\n        \"내용\": f\"전표 {len(by):,}건 중 불일치 {len(unbal):,}건\",\n    })\n\n    both = df[(df[\"차변\"] != 0) & (df[\"대변\"] != 0)]\n    checks.append({\n        \"항목\": \"차·대 동시 기재\",\n        \"결과\": \"없음\" if both.empty else \"확인필요\",\n        \"내용\": f\"{len(both):,}건\" + (\"\" if both.empty else \" — 한 행에 차변·대변이 모두 있음\"),\n    })\n\n    neg = df[(df[\"차변\"] < 0) | (df[\"대변\"] < 0)]\n    checks.append({\n        \"항목\": \"음수 금액\",\n        \"결과\": \"없음\" if neg.empty else \"확인필요\",\n        \"내용\": f\"{len(neg):,}건\" + (\"\" if neg.empty else \" — 반제·취소 전표일 수 있음\"),\n    })\n\n    bad_date = df[df[\"전표일자\"].isna()]\n    checks.append({\n        \"항목\": \"전표일자 인식\",\n        \"결과\": \"정상\" if bad_date.empty else \"확인필요\",\n        \"내용\": f\"인식 실패 {len(bad_date):,}건\",\n    })\n\n    if fy_end is not None:\n        fy_start = fy_end.replace(month=1, day=1)\n        out_range = df[df[\"전표일자\"].notna() &\n                       ((df[\"전표일자\"] < fy_start) | (df[\"전표일자\"] > fy_end))]\n        checks.append({\n            \"항목\": \"회계기간 범위\",\n            \"결과\": \"정상\" if out_range.empty else \"확인필요\",\n            \"내용\": f\"{fy_start:%Y-%m-%d} ~ {fy_end:%Y-%m-%d} 밖 {len(out_range):,}건\",\n        })\n    else:\n        out_range = df.iloc[0:0]\n\n    no_acct = df[df[\"계정과목\"].astype(str).str.strip() == \"\"]\n    checks.append({\n        \"항목\": \"계정과목 누락\",\n        \"결과\": \"없음\" if no_acct.empty else \"확인필요\",\n        \"내용\": f\"{len(no_acct):,}건\",\n    })\n\n    ok = all(c[\"결과\"] in (\"일치\", \"없음\", \"정상\") for c in checks)\n    return {\n        \"checks\": pd.DataFrame(checks),\n        \"ok\": ok,\n        \"dr\": dr, \"cr\": cr, \"diff\": diff,\n        \"unbalanced\": unbal,\n        \"both\": both, \"neg\": neg, \"bad_date\": bad_date,\n        \"out_range\": out_range, \"no_acct\": no_acct,\n        \"voucher_count\": int(len(by)),\n    }\n\n\ndef suggest_filename(company: str, fy_end: pd.Timestamp, version: int = 1) -> str:\n    \"\"\"FY25_마플_분개장 편집v1.xlsx 형태로.\"\"\"\n    name = re.sub(r\"^\\(?주\\)?\\s*|주식회사\\s*|\\(주\\)\", \"\", str(company)).strip()\n    name = re.sub(r\"[\\\\/:*?\\\"<>|]\", \"\", name) or \"회사\"\n    return f\"FY{fy_end:%y}_{name}_분개장 편집v{version}.xlsx\"\n",
  "core/ledger.py": "\"\"\"\n계정별원장 통합 엔진.\n\n계정별원장은 계정마다 시트가 하나씩 나뉘어 있고, 계정과목은 행이 아니라\n시트 이름과 머리글에만 있다. 이걸 계정과목 열을 가진 하나의 표로 합친다.\n\n소계행 판별에 주의: 적요에도 대괄호가 정상적으로 쓰인다\n([잡코리아]유료서비스 등). 따라서 대괄호 안의 내용이 정확히\n전기이월 · 월계 · 누계 · 전월이월 인 경우만 소계로 본다.\n\"\"\"\nimport re\n\nimport numpy as np\nimport pandas as pd\n\n# 통합 결과의 표준 열 — 편집본 서식을 따른다\nSTD = [\"계정과목\", \"날짜\", \"적요\", \"거래처코드\", \"거래처명\", \"사업자등록번호\",\n       \"차변금액\", \"대변금액\", \"차-대\", \"잔액\"]\n\n# 대괄호 안이 정확히 이것들일 때만 소계행\nSUBTOTAL_TAGS = {\"전기이월\", \"월계\", \"누계\", \"전월이월\", \"당기이월\", \"차기이월\", \"합계\", \"총계\"}\n\n# 시트명: \"0_보통예금(10300)\" → (10300, 보통예금)\nSHEET_RE = re.compile(r\"^\\d+_(.+?)\\((\\d+)\\)\\s*$\")\n# 머리글: \"계정과목 : 10300 - 보통예금\"\nHEADER_RE = re.compile(r\"계\\s*정\\s*과\\s*목\\s*:\\s*(\\d+)\\s*-\\s*(.+)$\")\n\n\ndef parse_sheet_name(name: str) -> tuple[str, str] | None:\n    \"\"\"시트명에서 계정코드와 계정명을 뽑는다.\"\"\"\n    m = SHEET_RE.match(str(name))\n    if m:\n        return m.group(2), m.group(1).strip()\n    return None\n\n\ndef parse_header_account(cells) -> tuple[str, str] | None:\n    \"\"\"머리글 영역의 '계정과목 : 10300 - 보통예금' 표기에서 뽑는다.\"\"\"\n    for v in cells:\n        if v is None:\n            continue\n        m = HEADER_RE.search(str(v))\n        if m:\n            return m.group(1), m.group(2).strip()\n    return None\n\n\ndef is_subtotal(memo) -> bool:\n    \"\"\"적요가 소계 표기인지. 대괄호 안이 정확히 소계어일 때만 True.\"\"\"\n    s = str(memo).strip()\n    if not s.startswith(\"[\") or \"]\" not in s:\n        return False\n    inner = re.sub(r\"\\s+\", \"\", s[1:s.index(\"]\")])\n    return inner in SUBTOTAL_TAGS\n\n\ndef to_number(s: pd.Series) -> pd.Series:\n    t = (s.astype(str).str.strip()\n         .str.replace(r\"[,\\s원₩]\", \"\", regex=True)\n         .str.replace(r\"^\\((.*)\\)$\", r\"-\\1\", regex=True))\n    t = t.replace({\"-\": \"0\", \"\": \"0\", \"nan\": \"0\", \"None\": \"0\", \"NaN\": \"0\"})\n    return pd.to_numeric(t, errors=\"coerce\").fillna(0.0)\n\n\ndef read_xls_sheets(path_or_buf) -> list[dict]:\n    \"\"\"\n    .xls / .xlsx 계정별원장을 시트별로 읽어 원시 데이터를 돌려준다.\n    각 항목: {name, code, account, header_row, df}\n    \"\"\"\n    import xlrd\n\n    if hasattr(path_or_buf, \"read\"):\n        data = path_or_buf.read()\n        wb = xlrd.open_workbook(file_contents=data)\n    else:\n        wb = xlrd.open_workbook(path_or_buf)\n\n    out = []\n    for i in range(wb.nsheets):\n        sh = wb.sheet_by_index(i)\n        if sh.nrows < 2:\n            continue\n\n        # 머리글 행 찾기 — '날짜'와 '차변'이 같은 행에 있는 곳\n        hdr = -1\n        for r in range(min(15, sh.nrows)):\n            row = [re.sub(r\"\\s+\", \"\", str(sh.cell_value(r, c)))\n                   for c in range(sh.ncols)]\n            if any(v == \"날짜\" for v in row) and any(\"차변\" in v for v in row):\n                hdr = r\n                break\n        if hdr < 0:\n            continue\n\n        # 계정과목 — 머리글 위 영역에서 먼저, 없으면 시트명에서\n        head_cells = [sh.cell_value(r, c) for r in range(hdr) for c in range(sh.ncols)]\n        acc = parse_header_account(head_cells) or parse_sheet_name(sh.name)\n        if acc is None:\n            acc = (\"\", str(sh.name))\n\n        cols = [re.sub(r\"\\s+\", \"\", str(sh.cell_value(hdr, c))) for c in range(sh.ncols)]\n        body = [[sh.cell_value(r, c) for c in range(sh.ncols)]\n                for r in range(hdr + 1, sh.nrows)]\n        df = pd.DataFrame(body, columns=cols)\n\n        out.append({\"name\": sh.name, \"code\": acc[0], \"account\": acc[1],\n                    \"header_row\": hdr, \"df\": df})\n    return out\n\n\n# 계정별원장 열 이름 → 표준 이름\nCOL_MAP = {\n    \"날짜\": \"날짜\", \"일자\": \"날짜\", \"거래일자\": \"날짜\",\n    \"적요란\": \"적요\", \"적요\": \"적요\", \"비고\": \"적요\",\n    \"코드\": \"거래처코드\", \"거래처코드\": \"거래처코드\",\n    \"거래처명\": \"거래처명\", \"거래처\": \"거래처명\",\n    \"사업자등록번호\": \"사업자등록번호\", \"사업자번호\": \"사업자등록번호\",\n    \"차변\": \"차변금액\", \"차변금액\": \"차변금액\",\n    \"대변\": \"대변금액\", \"대변금액\": \"대변금액\",\n    \"잔액\": \"잔액\",\n}\n\n\ndef combine(sheets: list[dict], drop_subtotal: bool = True,\n            drop_empty: bool = True) -> tuple[pd.DataFrame, pd.DataFrame]:\n    \"\"\"\n    시트들을 하나로 합친다.\n    돌려주는 값: (통합 데이터, 시트별 요약)\n    \"\"\"\n    frames, summary = [], []\n\n    for s in sheets:\n        df = s[\"df\"].rename(columns=COL_MAP)\n        for c in STD:\n            if c not in df.columns:\n                df[c] = \"\" if c not in (\"차변금액\", \"대변금액\", \"차-대\", \"잔액\") else 0.0\n\n        memo = df[\"적요\"].astype(str)\n        sub_mask = memo.map(is_subtotal)\n\n        for c in (\"차변금액\", \"대변금액\", \"잔액\"):\n            df[c] = to_number(df[c])\n\n        # 전기이월 — 차변·대변 각각 그대로 잡는다 (음수로 찍히는 계정이 있다)\n        open_mask = memo.map(lambda x: is_subtotal(x)\n                             and \"전기이월\" in re.sub(r\"\\s+\", \"\", x))\n        open_dr = float(df.loc[open_mask, \"차변금액\"].sum())\n        open_cr = float(df.loc[open_mask, \"대변금액\"].sum())\n\n        data = df[~sub_mask].copy() if drop_subtotal else df.copy()\n        if drop_empty:\n            data = data[(data[\"차변금액\"] != 0) | (data[\"대변금액\"] != 0)]\n\n        data[\"계정과목\"] = f\"[{s['code']}]{s['account']}\" if s[\"code\"] else s[\"account\"]\n        data[\"계정코드\"] = s[\"code\"]\n        data[\"계정명\"] = s[\"account\"]\n        data[\"원본시트\"] = s[\"name\"]\n\n        # 원장에 찍힌 [누계] 행 (검증 대조용)\n        cum = df[memo.map(lambda x: is_subtotal(x) and \"누계\" in re.sub(r\"\\s+\", \"\", x))]\n        cum_dr = float(cum[\"차변금액\"].iloc[-1]) if len(cum) else np.nan\n        cum_cr = float(cum[\"대변금액\"].iloc[-1]) if len(cum) else np.nan\n\n        summary.append({\n            \"계정코드\": s[\"code\"], \"계정명\": s[\"account\"], \"원본시트\": s[\"name\"],\n            \"행수\": len(data),\n            \"차변합계\": float(data[\"차변금액\"].sum()),\n            \"대변합계\": float(data[\"대변금액\"].sum()),\n            \"원장누계_차변\": cum_dr, \"원장누계_대변\": cum_cr,\n            \"전기이월_차변\": open_dr, \"전기이월_대변\": open_cr,\n        })\n        frames.append(data)\n\n    if not frames:\n        return pd.DataFrame(columns=STD), pd.DataFrame()\n\n    all_df = pd.concat(frames, ignore_index=True)\n    all_df[\"날짜\"] = all_df[\"날짜\"].astype(str).str.strip()\n    all_df[\"차-대\"] = all_df[\"차변금액\"] - all_df[\"대변금액\"]\n    for c in (\"적요\", \"거래처코드\", \"거래처명\", \"사업자등록번호\"):\n        all_df[c] = all_df[c].astype(str).replace(\n            {\"nan\": \"\", \"None\": \"\", \"NaT\": \"\"}).str.strip()\n\n    order = STD + [\"계정코드\", \"계정명\", \"원본시트\"]\n    all_df = all_df[[c for c in order if c in all_df.columns]]\n\n    sm = pd.DataFrame(summary)\n    # 원장의 [누계]는 전기이월을 포함한 값이므로 더해서 대조한다\n    sm[\"누계차이_차변\"] = sm[\"차변합계\"] + sm[\"전기이월_차변\"] - sm[\"원장누계_차변\"]\n    sm[\"누계차이_대변\"] = sm[\"대변합계\"] + sm[\"전기이월_대변\"] - sm[\"원장누계_대변\"]\n    return all_df, sm\n\n\ndef verify(df: pd.DataFrame, summary: pd.DataFrame,\n           period_end: pd.Timestamp | None = None) -> dict:\n    \"\"\"통합 원장 검증.\"\"\"\n    dr, cr = float(df[\"차변금액\"].sum()), float(df[\"대변금액\"].sum())\n    diff = dr - cr\n\n    checks = [{\n        \"항목\": \"총 차변 = 총 대변\",\n        \"결과\": \"일치\" if abs(diff) < 1 else \"불일치\",\n        \"내용\": f\"차변 {dr:,.0f} / 대변 {cr:,.0f}\"\n                + (\"\" if abs(diff) < 1 else f\" / 차이 {diff:,.0f}\"),\n    }]\n\n    # 원장에 찍힌 [누계]와 대조 — 소계행 판별이 맞았는지 확인하는 최고의 검증\n    tie = summary.dropna(subset=[\"원장누계_차변\"])\n    bad_tie = tie[(tie[\"누계차이_차변\"].abs() >= 1) | (tie[\"누계차이_대변\"].abs() >= 1)]\n    checks.append({\n        \"항목\": \"원장 [누계]와 대조\",\n        \"결과\": \"일치\" if bad_tie.empty else \"불일치\",\n        \"내용\": f\"대조 가능 {len(tie):,}개 계정 중 불일치 {len(bad_tie):,}개\",\n    })\n\n    both = df[(df[\"차변금액\"] != 0) & (df[\"대변금액\"] != 0)]\n    checks.append({\n        \"항목\": \"차·대 동시 기재\",\n        \"결과\": \"없음\" if both.empty else \"확인필요\",\n        \"내용\": f\"{len(both):,}건\",\n    })\n\n    neg = df[(df[\"차변금액\"] < 0) | (df[\"대변금액\"] < 0)]\n    checks.append({\n        \"항목\": \"음수 금액\",\n        \"결과\": \"없음\" if neg.empty else \"확인필요\",\n        \"내용\": f\"{len(neg):,}건\" + (\"\" if neg.empty else \" — 반제·취소 전표일 수 있음\"),\n    })\n\n    d = pd.to_datetime(df[\"날짜\"], errors=\"coerce\", format=\"mixed\")\n    bad_date = df[d.isna()]\n    checks.append({\n        \"항목\": \"날짜 인식\",\n        \"결과\": \"정상\" if bad_date.empty else \"확인필요\",\n        \"내용\": f\"인식 실패 {len(bad_date):,}건\",\n    })\n\n    if period_end is not None:\n        start = period_end.replace(month=1, day=1)\n        out_range = df[d.notna() & ((d < start) | (d > period_end))]\n        checks.append({\n            \"항목\": \"회계기간 범위\",\n            \"결과\": \"정상\" if out_range.empty else \"확인필요\",\n            \"내용\": f\"{start:%Y-%m-%d} ~ {period_end:%Y-%m-%d} 밖 {len(out_range):,}건\",\n        })\n    else:\n        out_range = df.iloc[0:0]\n\n    no_vendor = df[(df[\"거래처명\"] == \"\") & (df[\"거래처코드\"] == \"\")]\n    checks.append({\n        \"항목\": \"거래처 누락\",\n        \"결과\": \"없음\" if no_vendor.empty else \"참고\",\n        \"내용\": f\"{len(no_vendor):,}건 — 대체전표는 거래처가 없을 수 있음\",\n    })\n\n    ok = all(c[\"결과\"] in (\"일치\", \"없음\", \"정상\", \"참고\") for c in checks)\n    return {\"checks\": pd.DataFrame(checks), \"ok\": ok, \"dr\": dr, \"cr\": cr, \"diff\": diff,\n            \"bad_tie\": bad_tie, \"both\": both, \"neg\": neg, \"bad_date\": bad_date,\n            \"out_range\": out_range, \"no_vendor\": no_vendor}\n\n\ndef suggest_filename(company: str, period_end: pd.Timestamp, version: int = 1) -> str:\n    name = re.sub(r\"^\\(?주\\)?\\s*|주식회사\\s*|㈜|\\(주\\)\", \"\", str(company)).strip()\n    name = re.sub(r\"[\\\\/:*?\\\"<>|]\", \"\", name) or \"회사\"\n    return f\"FY{period_end:%y}_{name}_계정별원장 편집v{version}.xlsx\"\n",
